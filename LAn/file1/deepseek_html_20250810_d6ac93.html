<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流畅滚动式PDF阅读器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        :root {
            --primary: #165DFF;
            --primary-light: rgba(22, 93, 255, 0.1);
            --primary-dark: #0e4acc;
            --bg-light: #f5f7fa;
            --text-dark: #1a202c;
            --text-light: #718096;
            --sidebar-width: 280px;
        }
        
        body {
            overflow: hidden;
            background-color: var(--bg-light);
            color: var(--text-dark);
            transition: background-color 0.3s ease;
        }
        
        body.dark-mode {
            --bg-light: #1a202c;
            --text-dark: #e2e8f0;
            --text-light: #a0aec0;
            background-color: #121826;
        }
        
        .pdf-container {
            transition: all 0.3s ease;
        }
        
        .sidebar {
            transition: transform 0.3s ease;
            scrollbar-width: thin;
            z-index: 30;
        }
        
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        
        .sidebar::-webkit-scrollbar-thumb {
            background-color: var(--primary-light);
            border-radius: 3px;
        }
        
        .sidebar-item:hover {
            background-color: var(--primary-light);
        }
        
        .sidebar-item.active {
            background-color: var(--primary-light);
            border-left: 3px solid var(--primary);
        }
        
        .tool-btn {
            transition: all 0.2s ease;
        }
        
        .tool-btn:hover {
            background-color: var(--primary-light);
        }
        
        /* 连续滚动容器 */
        .scrolling-container {
            width: 100%;
            overflow-y: auto;
            position: relative;
        }
        
        .pages-container {
            position: relative;
            width: 100%;
        }
        
        .pdf-page {
            position: relative;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            background: white;
            overflow: hidden;
        }
        
        .dark-mode .pdf-page {
            background: #2d3748;
        }
        
        .page-canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        
        .text-layer {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            opacity: 0.2;
            line-height: 1.0;
        }
        
        .text-layer > span {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;
        }
        
        .text-layer .highlight {
            margin: -1px;
            padding: 1px;
            background-color: rgba(180, 0, 170, 0.2);
            border-radius: 4px;
        }
        
        .text-layer .highlight.appeared {
            background-color: rgba(180, 0, 170, 0.3);
        }
        
        .text-layer .highlight.begin {
            border-radius: 4px 0px 0px 4px;
        }
        
        .text-layer .highlight.end {
            border-radius: 0px 4px 4px 0px;
        }
        
        .text-layer .highlight.middle {
            border-radius: 0px;
        }
        
        .text-layer .highlight.selected {
            background-color: rgba(0, 100, 0, 0.3);
        }

        /* 加载动画 */
        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 进度条 */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(22, 93, 255, 0.1);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
        
        .progress-bar {
            height: 100%;
            width: 0;
            background: var(--primary);
            transition: width 0.3s ease;
        }
        
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(22, 93, 255, 0.3);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(22, 93, 255, 0.5);
        }
        
        .dark-mode ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }
        
        .dark-mode ::-webkit-scrollbar-thumb {
            background: rgba(22, 93, 255, 0.5);
        }
        
        /* 移动端优化 */
        @media (max-width: 767px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                width: 85%;
                max-width: 300px;
                box-shadow: 2px 0 15px rgba(0,0,0,0.1);
            }
            
            .sidebar.visible {
                transform: translateX(0);
            }
            
            .main-content {
                width: 100%;
                padding: 0;
            }
            
            nav .flex {
                flex-wrap: wrap;
            }
            
            .nav-controls {
                order: 3;
                width: 100%;
                justify-content: center;
                margin-top: 10px;
                padding: 5px 0;
                background: rgba(255,255,255,0.1);
                border-radius: 8px;
            }
            
            footer {
                flex-direction: column;
                padding: 10px;
            }
            
            footer > div {
                margin-bottom: 8px;
                width: 100%;
                justify-content: center;
            }
            
            .pdf-page {
                max-width: 95%;
            }
        }
        
        /* 移动端侧边栏覆盖层 */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 25;
        }
        
        .sidebar-overlay.visible {
            display: block;
        }
        
        /* 页面指示器 */
        .page-indicator {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 40;
            transition: opacity 0.3s;
        }
        
        /* 滚动提示 */
        .scroll-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 35;
            display: flex;
            align-items: center;
            animation: pulse 2s infinite;
        }
        
        .scroll-hint i {
            margin-right: 8px;
            animation: bounce 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        /* 页面过渡 */
        .page-enter {
            opacity: 0;
            transform: translateY(20px);
        }
        
        .page-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.5s ease;
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <!-- 顶部导航栏 -->
    <nav class="bg-[#165DFF] text-white p-3 flex flex-wrap items-center justify-between shadow-md z-20 dark:bg-[#0e4acc]">
        <div class="flex items-center">
            <button id="sidebar-toggle" class="mr-3 text-white">
                <i class="fas fa-bars text-xl"></i>
            </button>
            <h1 class="text-xl font-bold flex items-center">
                <i class="fas fa-file-pdf mr-2"></i>
                <span class="hidden sm:inline">流畅PDF阅读器</span>
            </h1>
        </div>
        
        <div class="nav-controls flex items-center space-x-1 sm:space-x-3">
            <button id="zoom-out" class="tool-btn p-2 rounded-full">
                <i class="fas fa-search-minus"></i>
            </button>
            <div class="relative w-24 sm:w-32">
                <input id="zoom-level" type="range" min="70" max="150" value="100" class="w-full">
                <div class="absolute -top-6 left-0 right-0 text-center text-xs font-medium">
                    <span id="zoom-percent">100%</span>
                </div>
            </div>
            <button id="zoom-in" class="tool-btn p-2 rounded-full">
                <i class="fas fa-search-plus"></i>
            </button>
            <button id="theme-toggle" class="tool-btn p-2 rounded-full">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <!-- 进度条 -->
    <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>

    <!-- 移动端侧边栏覆盖层 -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="flex flex-1 overflow-hidden relative">
        <!-- 侧边栏 -->
        <aside id="sidebar" class="sidebar bg-white dark:bg-gray-800 w-[280px] border-r border-gray-200 dark:border-gray-700 flex flex-col overflow-y-auto transition-all duration-300">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-200 flex items-center">
                        <i class="fas fa-folder-open mr-2 text-[#165DFF]"></i>文档库
                    </h2>
                </div>
                
                <div class="mt-3 relative">
                    <input type="text" id="filter-input" placeholder="过滤文档..." 
                           class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-1 focus:ring-[#165DFF]">
                    <i class="fas fa-search absolute right-3 top-2.5 text-gray-400 dark:text-gray-500"></i>
                </div>
            </div>
            <div class="overflow-y-auto flex-1">
                <ul id="pdf-list" class="py-2">
                    <!-- PDF列表将通过JavaScript动态生成 -->
                </ul>
            </div>
            
            <div class="p-3 border-t border-gray-200 dark:border-gray-700 flex justify-between items-center text-sm text-gray-500 dark:text-gray-400">
                <div>共 <span id="file-count">4</span> 个文档</div>
                <div id="doc-stats">未选择</div>
            </div>
        </aside>

        <!-- 主内容区 - 流畅滚动模式 -->
        <main class="main-content flex-1 flex flex-col overflow-hidden relative">
            <div id="pdf-container" class="pdf-container flex-1 overflow-hidden bg-gray-100 dark:bg-gray-900 relative">
                <div id="pdf-placeholder" class="flex flex-col items-center justify-center h-full text-center p-4 sm:p-8">
                    <i class="fas fa-file-pdf text-[#165DFF] text-6xl mb-4"></i>
                    <h2 class="text-2xl font-bold text-gray-700 dark:text-gray-300 mb-2">流畅PDF阅读器</h2>
                    <p class="text-gray-500 dark:text-gray-400 max-w-md">从左侧列表中选择一个PDF文件开始阅读</p>
                    <div class="mt-6 flex space-x-3">
                        <button id="show-sidebar-btn" class="px-4 py-2 bg-[#165DFF] text-white rounded-lg hover:bg-[#0e4acc] transition md:hidden">
                            <i class="fas fa-folder-open mr-2"></i>打开文档
                        </button>
                    </div>
                </div>
                
                <div id="loading" class="hidden absolute inset-0 bg-white dark:bg-gray-900 bg-opacity-90 dark:bg-opacity-90 flex flex-col items-center justify-center">
                    <div class="spinner"></div>
                    <span class="mt-4 text-gray-700 dark:text-gray-300 font-medium">正在加载文档...</span>
                    <div class="w-64 h-1 bg-gray-200 dark:bg-gray-700 rounded-full mt-6 overflow-hidden">
                        <div id="loading-bar" class="h-full bg-[#165DFF] w-0 transition-all duration-300"></div>
                    </div>
                </div>
                
                <!-- 流畅滚动容器 -->
                <div id="scrolling-container" class="scrolling-container h-full hidden">
                    <div id="pages-container" class="pages-container"></div>
                </div>
                
                <!-- 滚动提示 -->
                <div id="scroll-hint" class="scroll-hint hidden">
                    <i class="fas fa-arrow-down"></i>
                    <span>上下滑动浏览文档</span>
                </div>
            </div>
            
            <!-- 页面指示器 -->
            <div id="page-indicator" class="page-indicator hidden">
                第 <span id="current-page-indicator">1</span> 页 / 共 <span id="total-pages-indicator">1</span> 页
            </div>
        </main>
    </div>

    <!-- 底部状态栏 -->
    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 p-3 flex flex-col sm:flex-row items-center justify-between z-10">
        <div class="flex items-center mb-2 sm:mb-0">
            <span class="text-sm font-medium text-gray-700 dark:text-gray-300">
                缩放: <span id="zoom-value">100%</span>
            </span>
        </div>
        
        <div class="text-sm text-gray-500 dark:text-gray-400 mb-2 sm:mb-0 flex items-center">
            <i class="far fa-clock mr-1"></i>
            <span id="read-time">阅读时间: 0分钟</span>
        </div>
        
        <div class="flex items-center">
            <button id="download-btn" class="text-[#165DFF] hover:text-[#0e4acc] text-sm font-medium">
                <i class="fas fa-download mr-1"></i>下载
            </button>
        </div>
    </footer>

    <script>
        // PDF文件列表
        const pdfFiles = [
            {
                name: "《HTML5从入门到精通》中文学习教程.pdf",
                url: "https://chenmin2025.lovestoblog.com/LAn/file1/%E3%80%8AHTML5%E4%BB%8E%E5%85%A5%E9%97%A8%E5%88%B0%E7%B2%BE%E9%80%9A%E3%80%8B%E4%B8%AD%E6%96%87%E5%AD%A6%E4%B9%A0%E6%95%99%E7%A8%8B.pdf",
                size: "3.2 MB",
                pages: 412,
                lastOpened: "2023-10-15"
            },
            {
                name: "高一期末考试化学评分细则.pdf",
                url: "https://chenmin2025.lovestoblog.com/1_%E9%AB%98%E4%B8%80%E6%9C%9F%E6%9C%AB%E8%80%83%E8%AF%95%E5%8C%96%E5%AD%A6%E8%AF%84%E5%88%86%E7%BB%86%E5%88%99(2).pdf",
                size: "0.8 MB",
                pages: 8,
                lastOpened: "2023-11-20"
            },
            {
                name: "HTMLCSSJSCombined.pdf",
                url: "https://chenmin2025.lovestoblog.com/HTMLCSSJSCombined.pdf",
                size: "1.5 MB",
                pages: 120,
                lastOpened: "2023-09-05"
            },
            {
                name: "NODE.js入门手册.pdf",
                url: "https://chenmin2025.lovestoblog.com/LAn/file1/NODE.js%E5%85%A5%E9%97%A8%E6%89%8B%E5%86%8C.pdf",
                size: "2.1 MB",
                pages: 210,
                lastOpened: "2023-10-28"
            }
        ];

        // 应用状态
        const state = {
            currentPDF: null,
            currentPage: 1,
            totalPages: 1,
            zoomLevel: 1.0,
            rotation: 0,
            darkMode: false,
            currentFileIndex: -1,
            startTime: null,
            readTime: 0,
            sidebarVisible: window.innerWidth >= 768,
            isMobile: window.innerWidth < 768,
            renderedPages: new Set(),
            pagePositions: [],
            pageHeights: [],
            totalHeight: 0,
            viewportCache: {}
        };

        // DOM元素
        const elements = {
            pdfList: document.getElementById('pdf-list'),
            scrollingContainer: document.getElementById('scrolling-container'),
            pagesContainer: document.getElementById('pages-container'),
            currentPageIndicator: document.getElementById('current-page-indicator'),
            totalPagesIndicator: document.getElementById('total-pages-indicator'),
            pageIndicator: document.getElementById('page-indicator'),
            zoomLevel: document.getElementById('zoom-level'),
            zoomPercent: document.getElementById('zoom-percent'),
            zoomValue: document.getElementById('zoom-value'),
            pdfPlaceholder: document.getElementById('pdf-placeholder'),
            loading: document.getElementById('loading'),
            sidebarToggle: document.getElementById('sidebar-toggle'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebar-overlay'),
            fileCount: document.getElementById('file-count'),
            progressBar: document.getElementById('progress-bar'),
            themeToggle: document.getElementById('theme-toggle'),
            downloadBtn: document.getElementById('download-btn'),
            filterInput: document.getElementById('filter-input'),
            loadingBar: document.getElementById('loading-bar'),
            readTime: document.getElementById('read-time'),
            docStats: document.getElementById('doc-stats'),
            showSidebarBtn: document.getElementById('show-sidebar-btn'),
            scrollHint: document.getElementById('scroll-hint')
        };

        // 初始化PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // 渲染PDF列表
        function renderPDFList() {
            elements.pdfList.innerHTML = '';
            elements.fileCount.textContent = pdfFiles.length;
            
            const filterText = elements.filterInput.value.toLowerCase();
            let visibleCount = 0;
            
            pdfFiles.forEach((file, index) => {
                if (filterText && !file.name.toLowerCase().includes(filterText)) {
                    return;
                }
                
                visibleCount++;
                
                const listItem = document.createElement('li');
                listItem.className = 'sidebar-item px-4 py-3 cursor-pointer flex items-center border-b border-gray-100 dark:border-gray-700';
                listItem.innerHTML = `
                    <i class="fas fa-file-pdf text-[#165DFF] mr-3 text-lg"></i>
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-gray-800 dark:text-gray-200 truncate">${file.name}</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400 truncate">${file.size} · ${file.pages}页</div>
                    </div>
                `;
                
                listItem.addEventListener('click', () => {
                    // 移除所有active类
                    document.querySelectorAll('.sidebar-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    
                    // 添加active类到当前项
                    listItem.classList.add('active');
                    
                    // 重置阅读时间
                    state.startTime = new Date();
                    
                    // 加载PDF
                    loadPDF(index);
                    
                    // 在移动端选择文档后自动隐藏侧边栏
                    if (state.isMobile) {
                        toggleSidebar(false);
                    }
                });
                
                elements.pdfList.appendChild(listItem);
            });
            
            if (visibleCount === 0) {
                const emptyItem = document.createElement('li');
                emptyItem.className = 'px-4 py-6 text-center text-gray-500 dark:text-gray-400';
                emptyItem.innerHTML = `
                    <i class="fas fa-search fa-2x mb-3"></i>
                    <p>没有找到匹配的文档</p>
                `;
                elements.pdfList.appendChild(emptyItem);
            }
            
            if (state.currentFileIndex >= 0) {
                // 重新激活当前文档
                const items = elements.pdfList.querySelectorAll('.sidebar-item');
                if (items[state.currentFileIndex]) {
                    items[state.currentFileIndex].classList.add('active');
                }
            }
        }

        // 加载PDF文档
        async function loadPDF(index) {
            // 清除之前的状态
            state.renderedPages.clear();
            state.pagePositions = [];
            state.pageHeights = [];
            state.totalHeight = 0;
            state.viewportCache = {};
            elements.pagesContainer.innerHTML = '';
            
            if (index === state.currentFileIndex && state.currentPDF) return;
            
            try {
                const file = pdfFiles[index];
                
                // 更新状态
                state.currentFileIndex = index;
                
                // 显示加载状态
                elements.loading.classList.remove('hidden');
                elements.pdfPlaceholder.classList.add('hidden');
                elements.scrollHint.classList.add('hidden');
                elements.scrollingContainer.classList.add('hidden');
                elements.loadingBar.style.width = '0%';
                
                // 重置状态
                state.currentPage = 1;
                state.rotation = 0;
                state.zoomLevel = 1.0;
                state.currentPDF = null;
                elements.progressBar.style.width = '0%';
                
                // 更新文档信息
                elements.docStats.textContent = `${file.name} (${file.size})`;
                
                // 加载PDF
                const loadingTask = pdfjsLib.getDocument({
                    url: file.url,
                    withCredentials: true
                });
                
                // 加载进度监听
                loadingTask.onProgress = (progressData) => {
                    const progress = Math.round((progressData.loaded / progressData.total) * 100);
                    elements.progressBar.style.width = `${progress}%`;
                    elements.loadingBar.style.width = `${progress}%`;
                };
                
                const pdf = await loadingTask.promise;
                
                state.currentPDF = pdf;
                state.totalPages = pdf.numPages;
                elements.totalPagesIndicator.textContent = state.totalPages;
                
                // 显示滚动容器
                elements.scrollingContainer.classList.remove('hidden');
                elements.scrollHint.classList.remove('hidden');
                elements.pageIndicator.classList.remove('hidden');
                
                // 初始化页面结构
                initPages();
                
                // 保存最后打开时间
                file.lastOpened = new Date().toLocaleDateString();
                
                // 开始渲染可见页面
                checkVisiblePages();
                
                // 添加滚动监听
                elements.scrollingContainer.addEventListener('scroll', handleScroll);
                
                // 添加缩放监听
                elements.zoomLevel.addEventListener('input', handleZoomChange);
                
                // 5秒后隐藏滚动提示
                setTimeout(() => {
                    elements.scrollHint.classList.add('hidden');
                }, 5000);
                
            } catch (error) {
                console.error('Error loading PDF:', error);
                elements.pdfPlaceholder.innerHTML = `
                    <div class="text-center p-8">
                        <i class="fas fa-exclamation-triangle text-red-500 text-6xl mb-4"></i>
                        <h2 class="text-2xl font-bold text-gray-700 dark:text-gray-300 mb-2">加载PDF失败</h2>
                        <p class="text-gray-500 dark:text-gray-400 mb-4">${error.message || '无法加载文档，请检查网络连接'}</p>
                        <button class="retry-btn px-4 py-2 bg-[#165DFF] text-white rounded-lg hover:bg-[#0e4acc] transition">
                            <i class="fas fa-redo mr-2"></i>重试
                        </button>
                    </div>
                `;
                
                // 添加重试按钮事件
                document.querySelector('.retry-btn').addEventListener('click', () => {
                    loadPDF(state.currentFileIndex);
                });
                
                elements.pdfPlaceholder.classList.remove('hidden');
            } finally {
                setTimeout(() => {
                    elements.loading.classList.add('hidden');
                }, 500);
            }
        }

        // 初始化页面结构
        async function initPages() {
            elements.pagesContainer.innerHTML = '';
            state.pagePositions = [];
            state.pageHeights = [];
            state.totalHeight = 0;
            
            // 获取第一页用于计算尺寸
            const firstPage = await state.currentPDF.getPage(1);
            const viewport = firstPage.getViewport({ scale: state.zoomLevel * 1.5 });
            const pageWidth = viewport.width;
            
            // 创建页面容器
            for (let i = 1; i <= state.totalPages; i++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'pdf-page';
                pageDiv.style.width = `${pageWidth}px`;
                pageDiv.dataset.pageNumber = i;
                pageDiv.innerHTML = `
                    <canvas class="page-canvas"></canvas>
                    <div class="text-layer"></div>
                    <div class="loading-overlay absolute inset-0 bg-gray-100 dark:bg-gray-800 flex items-center justify-center">
                        <div class="spinner"></div>
                    </div>
                `;
                elements.pagesContainer.appendChild(pageDiv);
                
                // 存储页面位置信息
                state.pageHeights[i] = pageDiv.offsetHeight;
                state.pagePositions[i] = state.totalHeight;
                state.totalHeight += state.pageHeights[i] + 20; // 20px margin
            }
            
            // 设置容器高度
            elements.pagesContainer.style.height = `${state.totalHeight}px`;
        }

        // 检查并渲染可见页面
        async function checkVisiblePages() {
            const scrollTop = elements.scrollingContainer.scrollTop;
            const containerHeight = elements.scrollingContainer.clientHeight;
            
            // 确定可见范围
            const startY = scrollTop - 500; // 预加载上方500px
            const endY = scrollTop + containerHeight + 500; // 预加载下方500px
            
            // 确定当前页
            let currentPage = 1;
            for (let i = 1; i <= state.totalPages; i++) {
                if (scrollTop >= state.pagePositions[i] && 
                    scrollTop < state.pagePositions[i] + state.pageHeights[i]) {
                    currentPage = i;
                    break;
                }
            }
            
            // 更新当前页指示器
            state.currentPage = currentPage;
            elements.currentPageIndicator.textContent = currentPage;
            
            // 渲染当前页及附近页面
            const pagesToRender = new Set();
            for (let i = Math.max(1, currentPage - 2); i <= Math.min(state.totalPages, currentPage + 2); i++) {
                pagesToRender.add(i);
            }
            
            // 渲染需要显示的页面
            for (const pageNum of pagesToRender) {
                if (!state.renderedPages.has(pageNum)) {
                    await renderPage(pageNum);
                    state.renderedPages.add(pageNum);
                }
            }
        }

        // 渲染指定页面
        async function renderPage(pageNum) {
            const pageDiv = elements.pagesContainer.querySelector(`.pdf-page[data-page-number="${pageNum}"]`);
            if (!pageDiv) return;
            
            // 显示加载状态
            const loadingOverlay = pageDiv.querySelector('.loading-overlay');
            loadingOverlay.classList.remove('hidden');
            
            try {
                const page = await state.currentPDF.getPage(pageNum);
                
                // 检查是否已有缓存
                let viewport;
                if (state.viewportCache[pageNum]) {
                    viewport = state.viewportCache[pageNum];
                } else {
                    viewport = page.getViewport({ scale: state.zoomLevel * 1.5 });
                    state.viewportCache[pageNum] = viewport;
                }
                
                // 设置canvas尺寸
                const canvas = pageDiv.querySelector('.page-canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                // 更新页面尺寸
                pageDiv.style.width = `${viewport.width}px`;
                pageDiv.style.height = `${viewport.height}px`;
                
                // 渲染PDF页面
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                
                await page.render(renderContext).promise;
                
                // 渲染文本图层
                const textLayer = pageDiv.querySelector('.text-layer');
                textLayer.style.width = `${viewport.width}px`;
                textLayer.style.height = `${viewport.height}px`;
                
                // 创建文本图层
                const textContent = await page.getTextContent();
                pdfjsLib.renderTextLayer({
                    textContent: textContent,
                    container: textLayer,
                    viewport: viewport,
                    textDivs: []
                });
                
                // 添加页面动画
                pageDiv.style.opacity = '0';
                pageDiv.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    pageDiv.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    pageDiv.style.opacity = '1';
                    pageDiv.style.transform = 'translateY(0)';
                }, 50);
                
            } catch (error) {
                console.error(`Error rendering page ${pageNum}:`, error);
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        }

        // 处理滚动事件
        function handleScroll() {
            checkVisiblePages();
            
            // 隐藏页面指示器
            clearTimeout(state.scrollTimer);
            elements.pageIndicator.style.opacity = '1';
            state.scrollTimer = setTimeout(() => {
                elements.pageIndicator.style.opacity = '0';
            }, 2000);
        }

        // 处理缩放变化
        function handleZoomChange() {
            const zoomValue = parseInt(elements.zoomLevel.value);
            state.zoomLevel = zoomValue / 100;
            elements.zoomPercent.textContent = `${zoomValue}%`;
            elements.zoomValue.textContent = `${zoomValue}%`;
            
            // 重新初始化页面
            if (state.currentPDF) {
                initPages().then(() => {
                    checkVisiblePages();
                    elements.scrollingContainer.scrollTop = 0;
                });
            }
        }

        // 切换侧边栏显示状态
        function toggleSidebar(show) {
            if (window.innerWidth >= 768) return;
            
            state.sidebarVisible = show !== undefined ? show : !state.sidebarVisible;
            
            if (state.sidebarVisible) {
                elements.sidebar.classList.add('visible');
                elements.sidebarOverlay.classList.add('visible');
            } else {
                elements.sidebar.classList.remove('visible');
                elements.sidebarOverlay.classList.remove('visible');
            }
        }

        // 初始化事件监听器
        function initEventListeners() {
            // 侧边栏切换
            elements.sidebarToggle.addEventListener('click', () => {
                toggleSidebar();
            });
            
            // 移动端显示侧边栏按钮
            elements.showSidebarBtn.addEventListener('click', () => {
                toggleSidebar(true);
            });
            
            // 侧边栏覆盖层点击关闭
            elements.sidebarOverlay.addEventListener('click', () => {
                toggleSidebar(false);
            });
            
            // 主题切换
            elements.themeToggle.addEventListener('click', () => {
                state.darkMode = !state.darkMode;
                document.body.classList.toggle('dark-mode', state.darkMode);
                elements.themeToggle.innerHTML = state.darkMode 
                    ? '<i class="fas fa-sun"></i>' 
                    : '<i class="fas fa-moon"></i>';
            });
            
            // 下载功能
            elements.downloadBtn.addEventListener('click', () => {
                if (state.currentFileIndex >= 0) {
                    const file = pdfFiles[state.currentFileIndex];
                    const link = document.createElement('a');
                    link.href = file.url;
                    link.download = file.name;
                    link.target = '_blank';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            });
            
            // 文档过滤
            elements.filterInput.addEventListener('input', () => {
                renderPDFList();
            });
            
            // 阅读时间跟踪
            setInterval(() => {
                if (state.startTime) {
                    const now = new Date();
                    const diff = Math.floor((now - state.startTime) / 1000 / 60);
                    state.readTime = diff;
                    elements.readTime.textContent = `阅读时间: ${diff}分钟`;
                }
            }, 60000);
            
            // 窗口大小变化时调整布局
            window.addEventListener('resize', () => {
                state.isMobile = window.innerWidth < 768;
                
                if (window.innerWidth >= 768) {
                    // 桌面端显示侧边栏
                    elements.sidebar.classList.remove('hidden');
                    elements.sidebarOverlay.classList.remove('visible');
                } else {
                    // 移动端默认隐藏侧边栏
                    toggleSidebar(false);
                }
                
                // 重新计算页面位置
                if (state.currentPDF) {
                    initPages().then(() => {
                        checkVisiblePages();
                    });
                }
            });
        }

        // 初始化应用
        function initApp() {
            renderPDFList();
            initEventListeners();
            
            // 初始加载第一个PDF
            setTimeout(() => {
                const firstItem = elements.pdfList.querySelector('.sidebar-item');
                if (firstItem) {
                    firstItem.click();
                }
            }, 500);
            
            // 检查系统主题偏好
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                state.darkMode = true;
                document.body.classList.add('dark-mode');
                elements.themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            }
            
            // 移动端默认隐藏侧边栏
            if (state.isMobile) {
                toggleSidebar(false);
            }
        }

        // 启动应用
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
