<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高效PDF阅读器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.worker.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #4285f4;
            --text-color: #333;
            --bg-color: #fff;
            --sidebar-bg: #f5f5f5;
            --sidebar-width: 250px;
            --toolbar-bg: #f1f1f1;
            --border-color: #ddd;
            --hover-color: #f0f0f0;
            --active-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.2);
            --error-color: #f44336;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --info-color: #2196f3;
        }

        /* 夜间模式变量 */
        .night-mode {
            --primary-color: #8ab4f8;
            --text-color: #e0e0e0;
            --bg-color: #121212;
            --sidebar-bg: #1e1e1e;
            --toolbar-bg: #2d2d2d;
            --border-color: #444;
            --hover-color: #333;
            --active-color: #444;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        /* 护眼模式变量 */
        .eye-protect-mode {
            --bg-color: #f5f5dc;
            --text-color: #5a5a5a;
            --sidebar-bg: #e8e8d0;
            --toolbar-bg: #e0e0c8;
        }

        /* Sepia模式变量 */
        .sepia-mode {
            --bg-color: #f4ecd8;
            --text-color: #5b4636;
            --sidebar-bg: #e8ddc5;
            --toolbar-bg: #e0d5bd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航栏 */
        .navbar {
            height: 50px;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-shadow: 0 2px 5px var(--shadow-color);
            z-index: 100;
        }

        .navbar-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-right: auto;
        }

        .navbar-actions {
            display: flex;
            gap: 10px;
        }

        .navbar-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .navbar-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* 主内容区域 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 侧边栏 */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 10;
            height: 100%;
        }

        .sidebar.collapsed {
            transform: translateX(calc(var(--sidebar-width) * -1 + 30px));
        }

        .sidebar-toggle {
            position: absolute;
            right: -30px;
            top: 10px;
            width: 30px;
            height: 30px;
            background-color: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-left: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .sidebar-header {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .sidebar-tab.active {
            border-bottom: 2px solid var(--primary-color);
            font-weight: bold;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* 目录样式 */
        .toc-item {
            padding: 5px 0;
            cursor: pointer;
        }

        .toc-item:hover {
            color: var(--primary-color);
        }

        .toc-item.level1 {
            padding-left: 10px;
            font-weight: bold;
        }

        .toc-item.level2 {
            padding-left: 25px;
        }

        .toc-item.level3 {
            padding-left: 40px;
        }

        /* 缩略图样式 */
        .thumbnails-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 5px;
        }

        .thumbnail {
            border: 1px solid var(--border-color);
            cursor: pointer;
            aspect-ratio: 1 / 1.414; /* A4比例 */
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            overflow: hidden;
        }

        .thumbnail.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px var(--primary-color);
        }

        .thumbnail img {
            width: 100%;
            height: auto;
        }

        /* PDF查看区域 */
        .pdf-container {
            flex: 1;
            position: relative;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .pdf-viewer {
            position: relative;
            box-shadow: 0 0 10px var(--shadow-color);
        }

        .pdf-page {
            margin-bottom: 20px;
            position: relative;
        }

        .pdf-page canvas {
            display: block;
        }

        /* 加载指示器 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: white;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 进度条 */
        .progress-container {
            width: 100%;
            height: 4px;
            background-color: var(--border-color);
            position: fixed;
            top: 50px;
            left: 0;
            z-index: 100;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary-color);
            width: 0;
            transition: width 0.3s;
        }

        /* 悬浮操作块 */
        .floating-toolbar {
            position: fixed;
            top: 70px;
            right: 20px;
            background-color: var(--toolbar-bg);
            border-radius: 8px;
            box-shadow: 0 2px 10px var(--shadow-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 50;
            user-select: none;
        }

        .floating-toolbar.draggable {
            cursor: move;
        }

        .toolbar-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
        }

        .toolbar-btn:hover {
            background-color: var(--hover-color);
        }

        .toolbar-btn.active {
            background-color: var(--active-color);
        }

        .toolbar-btn i {
            font-size: 16px;
        }

        .tooltip {
            position: absolute;
            right: 50px;
            background-color: var(--toolbar-bg);
            padding: 5px 10px;
            border-radius: 4px;
            box-shadow: 0 2px 5px var(--shadow-color);
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .toolbar-btn:hover .tooltip {
            opacity: 1;
        }

        /* 页码控制 */
        .page-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--toolbar-bg);
            border-radius: 20px;
            padding: 5px 15px;
            box-shadow: 0 2px 10px var(--shadow-color);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 50;
        }

        .page-input {
            width: 50px;
            text-align: center;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* 阅读模式选择 */
        .view-mode-selector {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--toolbar-bg);
            border-radius: 20px;
            padding: 5px;
            box-shadow: 0 2px 10px var(--shadow-color);
            display: flex;
            gap: 5px;
            z-index: 50;
        }

        .view-mode-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 15px;
            background-color: transparent;
            cursor: pointer;
            color: var(--text-color);
        }

        .view-mode-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        /* 错误提示 */
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--error-color);
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            box-shadow: 0 2px 10px var(--shadow-color);
            z-index: 1000;
            display: none;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 50px;
                bottom: 0;
                left: 0;
                z-index: 100;
                transform: translateX(-100%);
            }

            .sidebar.collapsed {
                transform: translateX(-100%);
            }

            .sidebar-toggle {
                display: none;
            }

            .sidebar.visible {
                transform: translateX(0);
            }

            .floating-toolbar {
                top: auto;
                bottom: 80px;
                right: 10px;
                flex-direction: row;
            }

            .page-controls {
                bottom: 10px;
                padding: 3px 10px;
            }

            .view-mode-selector {
                bottom: 60px;
                padding: 3px;
            }
        }

        /* 纯净阅读模式 */
        .pure-mode .navbar,
        .pure-mode .sidebar,
        .pure-mode .floating-toolbar,
        .pure-mode .page-controls,
        .pure-mode .view-mode-selector {
            display: none;
        }

        .pure-mode .pdf-container {
            padding: 0;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="navbar">
        <div class="navbar-title">高效PDF阅读器</div>
        <div class="navbar-actions">
            <button class="navbar-btn" id="open-file">
                <i class="fas fa-folder-open"></i> 打开
            </button>
            <button class="navbar-btn" id="toggle-sidebar">
                <i class="fas fa-list"></i> 目录
            </button>
            <button class="navbar-btn" id="toggle-pure-mode">
                <i class="fas fa-expand"></i> 纯净模式
            </button>
        </div>
    </div>

    <!-- 进度条 -->
    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- 主内容区域 -->
    <div class="main-container">
        <!-- 侧边栏 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-toggle" id="sidebar-toggle">
                <i class="fas fa-chevron-right"></i>
            </div>
            <div class="sidebar-header">
                <h3>导航</h3>
                <button id="close-sidebar"><i class="fas fa-times"></i></button>
            </div>
            <div class="sidebar-tabs">
                <div class="sidebar-tab active" data-tab="toc">目录</div>
                <div class="sidebar-tab" data-tab="thumbnails">缩略图</div>
                <div class="sidebar-tab" data-tab="bookmarks">书签</div>
            </div>
            <div class="sidebar-content">
                <div class="tab-content active" id="toc-content">
                    <div id="toc-list"></div>
                </div>
                <div class="tab-content" id="thumbnails-content">
                    <div class="thumbnails-container" id="thumbnails-container"></div>
                </div>
                <div class="tab-content" id="bookmarks-content">
                    <div id="bookmarks-list"></div>
                </div>
            </div>
        </div>

        <!-- PDF查看区域 -->
        <div class="pdf-container" id="pdf-container">
            <div class="pdf-viewer" id="pdf-viewer"></div>
        </div>
    </div>

    <!-- 悬浮操作块 -->
    <div class="floating-toolbar draggable" id="floating-toolbar">
        <button class="toolbar-btn" id="zoom-in" title="放大">
            <i class="fas fa-search-plus"></i>
            <span class="tooltip">放大 (Ctrl + +)</span>
        </button>
        <button class="toolbar-btn" id="zoom-out" title="缩小">
            <i class="fas fa-search-minus"></i>
            <span class="tooltip">缩小 (Ctrl + -)</span>
        </button>
        <button class="toolbar-btn" id="fit-width" title="适合宽度">
            <i class="fas fa-arrows-alt-h"></i>
            <span class="tooltip">适合宽度</span>
        </button>
        <button class="toolbar-btn" id="fit-height" title="适合高度">
            <i class="fas fa-arrows-alt-v"></i>
            <span class="tooltip">适合高度</span>
        </button>
        <button class="toolbar-btn" id="prev-page" title="上一页">
            <i class="fas fa-arrow-left"></i>
            <span class="tooltip">上一页 (←)</span>
        </button>
        <button class="toolbar-btn" id="next-page" title="下一页">
            <i class="fas fa-arrow-right"></i>
            <span class="tooltip">下一页 (→)</span>
        </button>
        <button class="toolbar-btn" id="toggle-night-mode" title="夜间模式">
            <i class="fas fa-moon"></i>
            <span class="tooltip">夜间模式 (Ctrl+Shift+N)</span>
        </button>
        <button class="toolbar-btn" id="print-pdf" title="打印">
            <i class="fas fa-print"></i>
            <span class="tooltip">打印 (Ctrl+P)</span>
        </button>
        <button class="toolbar-btn" id="download-pdf" title="下载">
            <i class="fas fa-download"></i>
            <span class="tooltip">下载</span>
        </button>
    </div>

    <!-- 阅读模式选择 -->
    <div class="view-mode-selector">
        <button class="view-mode-btn active" data-mode="single">单页</button>
        <button class="view-mode-btn" data-mode="double">双页</button>
        <button class="view-mode-btn" data-mode="scroll">连续</button>
    </div>

    <!-- 页码控制 -->
    <div class="page-controls">
        <button class="toolbar-btn" id="first-page" title="第一页">
            <i class="fas fa-step-backward"></i>
        </button>
        <button class="toolbar-btn" id="prev-page2" title="上一页">
            <i class="fas fa-chevron-left"></i>
        </button>
        <input type="number" class="page-input" id="current-page" min="1" value="1">
        <span id="total-pages">/ 1</span>
        <button class="toolbar-btn" id="next-page2" title="下一页">
            <i class="fas fa-chevron-right"></i>
        </button>
        <button class="toolbar-btn" id="last-page" title="最后一页">
            <i class="fas fa-step-forward"></i>
        </button>
    </div>

    <!-- 加载指示器 -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">加载PDF文档...</div>
    </div>

    <!-- 错误提示 -->
    <div class="error-message" id="error-message"></div>

    <!-- 文件输入 (隐藏) -->
    <input type="file" id="file-input" accept=".pdf" style="display: none;">

    <script>
        // 初始化PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.worker.min.js';

        // 全局变量
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 1;
        let currentScale = 1.0;
        let currentViewMode = 'single';
        let isNightMode = false;
        let isPureMode = false;
        let isSidebarCollapsed = false;
        let activeTab = 'toc';
        let renderedPages = new Set();
        let pageRendering = false;
        let pageNumPending = null;
        let pdfQueue = [];
        let isRendering = false;

        // DOM元素
        const pdfContainer = document.getElementById('pdf-container');
        const pdfViewer = document.getElementById('pdf-viewer');
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const closeSidebarBtn = document.getElementById('close-sidebar');
        const toggleSidebarBtn = document.getElementById('toggle-sidebar');
        const floatingToolbar = document.getElementById('floating-toolbar');
        const progressBar = document.getElementById('progress-bar');
        const currentPageInput = document.getElementById('current-page');
        const totalPagesSpan = document.getElementById('total-pages');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const errorMessage = document.getElementById('error-message');
        const fileInput = document.getElementById('file-input');
        const openFileBtn = document.getElementById('open-file');
        const togglePureModeBtn = document.getElementById('toggle-pure-mode');
        const toggleNightModeBtn = document.getElementById('toggle-night-mode');
        const tocList = document.getElementById('toc-list');
        const thumbnailsContainer = document.getElementById('thumbnails-container');
        const bookmarksList = document.getElementById('bookmarks-list');
        const tabContents = document.querySelectorAll('.tab-content');
        const tabButtons = document.querySelectorAll('.sidebar-tab');
        const viewModeButtons = document.querySelectorAll('.view-mode-btn');

        // 预定义PDF列表
        const predefinedPDFs = [
            {
                name: "《HTML5从入门到精通》中文学习教程.pdf",
                url: "https://chenmin2025.lovestoblog.com/LAn/file1/%E3%80%8AHTML5%E4%BB%8E%E5%85%A5%E9%97%A8%E5%88%B0%E7%B2%BE%E9%80%9A%E3%80%8B%E4%B8%AD%E6%96%87%E5%AD%A6%E4%B9%A0%E6%95%99%E7%A8%8B.pdf"
            },
            {
                name: "编写高质量代码--Web前端开发修炼之道.pdf",
                url: "https://chenmin2025.lovestoblog.com/LAn/file1/%E7%BC%96%E5%86%99%E9%AB%98%E8%B4%A8%E9%87%8F%E4%BB%A3%E7%A0%81--Web%E5%89%8D%E7%AB%AF%E5%BC%80%E5%8F%91%E4%BF%AE%E7%82%BC%E4%B9%8B%E9%81%93.pdf"
            }
        ];

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initEventListeners();
            initDraggableToolbar();
            showPredefinedPDFs();
        });

        // 初始化事件监听器
        function initEventListeners() {
            // 导航按钮
            document.getElementById('zoom-in').addEventListener('click', () => zoomPDF(0.2));
            document.getElementById('zoom-out').addEventListener('click', () => zoomPDF(-0.2));
            document.getElementById('fit-width').addEventListener('click', () => fitToWidth());
            document.getElementById('fit-height').addEventListener('click', () => fitToHeight());
            document.getElementById('prev-page').addEventListener('click', () => gotoPrevPage());
            document.getElementById('next-page').addEventListener('click', () => gotoNextPage());
            document.getElementById('first-page').addEventListener('click', () => gotoPage(1));
            document.getElementById('last-page').addEventListener('click', () => gotoPage(totalPages));
            document.getElementById('prev-page2').addEventListener('click', () => gotoPrevPage());
            document.getElementById('next-page2').addEventListener('click', () => gotoNextPage());
            document.getElementById('print-pdf').addEventListener('click', printPDF);
            document.getElementById('download-pdf').addEventListener('click', downloadPDF);
            
            // 页码输入
            currentPageInput.addEventListener('change', () => {
                const pageNum = parseInt(currentPageInput.value);
                if (pageNum >= 1 && pageNum <= totalPages) {
                    gotoPage(pageNum);
                } else {
                    currentPageInput.value = currentPage;
                }
            });
            
            // 侧边栏控制
            sidebarToggle.addEventListener('click', toggleSidebar);
            closeSidebarBtn.addEventListener('click', toggleSidebar);
            toggleSidebarBtn.addEventListener('click', toggleMobileSidebar);
            
            // 文件操作
            openFileBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);
            
            // 模式切换
            togglePureModeBtn.addEventListener('click', togglePureMode);
            toggleNightModeBtn.addEventListener('click', toggleNightMode);
            
            // 标签切换
            tabButtons.forEach(button => {
                button.addEventListener('click', () => switchTab(button.dataset.tab));
            });
            
            // 阅读模式切换
            viewModeButtons.forEach(button => {
                button.addEventListener('click', () => switchViewMode(button.dataset.mode));
            });
            
            // 键盘快捷键
            document.addEventListener('keydown', handleKeyboardShortcuts);
            
            // 触摸手势
            pdfContainer.addEventListener('touchstart', handleTouchStart, { passive: false });
            pdfContainer.addEventListener('touchmove', handleTouchMove, { passive: false });
            
            // 滚动加载
            pdfContainer.addEventListener('scroll', handleScroll);
            
            // 窗口大小变化
            window.addEventListener('resize', debounce(handleResize, 200));
        }

        // 显示预定义PDF列表
        function showPredefinedPDFs() {
            const dropdown = document.createElement('div');
            dropdown.style.position = 'absolute';
            dropdown.style.top = '50px';
            dropdown.style.right = '10px';
            dropdown.style.backgroundColor = 'var(--toolbar-bg)';
            dropdown.style.borderRadius = '8px';
            dropdown.style.boxShadow = '0 2px 10px var(--shadow-color)';
            dropdown.style.padding = '10px';
            dropdown.style.zIndex = '1000';
            dropdown.style.display = 'none';
            dropdown.id = 'pdf-dropdown';
            
            const title = document.createElement('div');
            title.textContent = '选择PDF文档';
            title.style.fontWeight = 'bold';
            title.style.marginBottom = '10px';
            dropdown.appendChild(title);
            
            predefinedPDFs.forEach(pdf => {
                const item = document.createElement('div');
                item.textContent = pdf.name;
                item.style.padding = '5px 10px';
                item.style.cursor = 'pointer';
                item.style.borderRadius = '4px';
                item.addEventListener('mouseenter', () => {
                    item.style.backgroundColor = 'var(--hover-color)';
                });
                item.addEventListener('mouseleave', () => {
                    item.style.backgroundColor = 'transparent';
                });
                item.addEventListener('click', () => {
                    loadPDFFromURL(pdf.url);
                    dropdown.style.display = 'none';
                });
                dropdown.appendChild(item);
            });
            
            document.body.appendChild(dropdown);
            
            openFileBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const dropdown = document.getElementById('pdf-dropdown');
                dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
            });
            
            document.addEventListener('click', (e) => {
                if (e.target !== openFileBtn && !openFileBtn.contains(e.target)) {
                    const dropdown = document.getElementById('pdf-dropdown');
                    if (dropdown && dropdown.style.display !== 'none') {
                        dropdown.style.display = 'none';
                    }
                }
            });
        }

        // 从URL加载PDF
        function loadPDFFromURL(url) {
            showLoading('正在加载PDF文档...');
            
            // 清除之前的PDF
            pdfViewer.innerHTML = '';
            renderedPages.clear();
            currentPage = 1;
            
            // 加载PDF
            pdfjsLib.getDocument(url).promise.then(function(pdf) {
                pdfDoc = pdf;
                totalPages = pdf.numPages;
                totalPagesSpan.textContent = `/ ${totalPages}`;
                currentPageInput.max = totalPages;
                
                // 渲染第一页
                renderPage(currentPage);
                
                // 预加载附近页面
                preloadNearbyPages(currentPage);
                
                // 加载目录
                loadOutline();
                
                // 加载缩略图
                loadThumbnails();
                
                hideLoading();
            }).catch(function(error) {
                showError('加载PDF失败: ' + error.message);
                hideLoading();
            });
        }

        // 处理文件选择
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file && file.type === 'application/pdf') {
                showLoading('正在加载PDF文件...');
                
                const fileReader = new FileReader();
                fileReader.onload = function() {
                    const typedArray = new Uint8Array(this.result);
                    
                    // 清除之前的PDF
                    pdfViewer.innerHTML = '';
                    renderedPages.clear();
                    currentPage = 1;
                    
                    // 加载PDF
                    pdfjsLib.getDocument(typedArray).promise.then(function(pdf) {
                        pdfDoc = pdf;
                        totalPages = pdf.numPages;
                        totalPagesSpan.textContent = `/ ${totalPages}`;
                        currentPageInput.max = totalPages;
                        
                        // 渲染第一页
                        renderPage(currentPage);
                        
                        // 预加载附近页面
                        preloadNearbyPages(currentPage);
                        
                        // 加载目录
                        loadOutline();
                        
                        // 加载缩略图
                        loadThumbnails();
                        
                        hideLoading();
                    }).catch(function(error) {
                        showError('加载PDF失败: ' + error.message);
                        hideLoading();
                    });
                };
                fileReader.readAsArrayBuffer(file);
            } else {
                showError('请选择有效的PDF文件');
            }
        }

        // 渲染PDF页面
        function renderPage(num) {
            if (pageRendering || !pdfDoc) return;
            
            pageRendering = true;
            currentPage = num;
            currentPageInput.value = num;
            updateProgress();
            
            // 检查是否已经渲染过该页面
            if (renderedPages.has(num)) {
                scrollToPage(num);
                pageRendering = false;
                return;
            }
            
            // 获取页面
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: currentScale });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                // 创建页面容器
                const pageDiv = document.createElement('div');
                pageDiv.className = 'pdf-page';
                pageDiv.dataset.pageNumber = num;
                pageDiv.appendChild(canvas);
                
                // 根据查看模式决定如何添加页面
                if (currentViewMode === 'single') {
                    // 单页模式 - 替换当前页面
                    const existingPage = pdfViewer.querySelector(`.pdf-page[data-page-number="${num}"]`);
                    if (existingPage) {
                        pdfViewer.replaceChild(pageDiv, existingPage);
                    } else {
                        pdfViewer.innerHTML = '';
                        pdfViewer.appendChild(pageDiv);
                    }
                } else if (currentViewMode === 'double') {
                    // 双页模式 - 显示当前页和下一页
                    if (num % 2 === 1) {
                        // 奇数页 - 显示当前页和下一页
                        pdfViewer.innerHTML = '';
                        pdfViewer.appendChild(pageDiv);
                        
                        if (num < totalPages) {
                            renderPage(num + 1);
                        }
                    } else {
                        // 偶数页 - 显示上一页和当前页
                        if (num > 1) {
                            renderPage(num - 1);
                        }
                    }
                } else if (currentViewMode === 'scroll') {
                    // 连续滚动模式 - 添加所有页面
                    const existingPage = pdfViewer.querySelector(`.pdf-page[data-page-number="${num}"]`);
                    if (existingPage) {
                        pdfViewer.replaceChild(pageDiv, existingPage);
                    } else {
                        // 找到正确的位置插入页面
                        let inserted = false;
                        const pages = pdfViewer.querySelectorAll('.pdf-page');
                        for (let i = 0; i < pages.length; i++) {
                            const pageNum = parseInt(pages[i].dataset.pageNumber);
                            if (num < pageNum) {
                                pdfViewer.insertBefore(pageDiv, pages[i]);
                                inserted = true;
                                break;
                            }
                        }
                        if (!inserted) {
                            pdfViewer.appendChild(pageDiv);
                        }
                    }
                }
                
                // 渲染页面内容
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                
                const renderTask = page.render(renderContext);
                
                renderTask.promise.then(function() {
                    renderedPages.add(num);
                    pageRendering = false;
                    
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                    
                    scrollToPage(num);
                });
            }).catch(function(error) {
                showError('渲染页面失败: ' + error.message);
                pageRendering = false;
                
                if (pageNumPending !== null) {
                    renderPage(pageNumPending);
                    pageNumPending = null;
                }
            });
        }

        // 预加载附近页面
        function preloadNearbyPages(currentNum) {
            const preloadRange = 3; // 预加载前后3页
            const start = Math.max(1, currentNum - preloadRange);
            const end = Math.min(totalPages, currentNum + preloadRange);
            
            for (let i = start; i <= end; i++) {
                if (!renderedPages.has(i) && i !== currentNum) {
                    queuePageRender(i);
                }
            }
        }

        // 队列页面渲染
        function queuePageRender(num) {
            if (!pdfQueue.includes(num) && !renderedPages.has(num)) {
                pdfQueue.push(num);
                
                if (!isRendering) {
                    processRenderQueue();
                }
            }
        }

        // 处理渲染队列
        function processRenderQueue() {
            if (pdfQueue.length === 0 || pageRendering) {
                isRendering = false;
                return;
            }
            
            isRendering = true;
            const num = pdfQueue.shift();
            
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: currentScale });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                // 创建页面容器但不显示
                const pageDiv = document.createElement('div');
                pageDiv.className = 'pdf-page';
                pageDiv.dataset.pageNumber = num;
                pageDiv.style.display = 'none';
                pageDiv.appendChild(canvas);
                pdfViewer.appendChild(pageDiv);
                
                // 渲染页面内容
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                
                page.render(renderContext).promise.then(function() {
                    renderedPages.add(num);
                    processRenderQueue();
                }).catch(function(error) {
                    console.error('预加载页面失败:', error);
                    processRenderQueue();
                });
            }).catch(function(error) {
                console.error('获取预加载页面失败:', error);
                processRenderQueue();
            });
        }

        // 滚动到指定页面
        function scrollToPage(num) {
            if (currentViewMode === 'single' || currentViewMode === 'double') {
                const pageDiv = pdfViewer.querySelector(`.pdf-page[data-page-number="${num}"]`);
                if (pageDiv) {
                    pdfContainer.scrollTo({
                        top: pageDiv.offsetTop - 20,
                        behavior: 'smooth'
                    });
                }
            }
        }

        // 跳转到页面
        function gotoPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
                preloadNearbyPages(num);
            }
        }

        // 上一页
        function gotoPrevPage() {
            if (currentPage > 1) {
                if (currentViewMode === 'double' && currentPage % 2 === 0) {
                    gotoPage(currentPage - 2);
                } else {
                    gotoPage(currentPage - 1);
                }
            }
        }

        // 下一页
        function gotoNextPage() {
            if (currentPage < totalPages) {
                if (currentViewMode === 'double' && currentPage % 2 === 1 && currentPage < totalPages - 1) {
                    gotoPage(currentPage + 2);
                } else {
                    gotoPage(currentPage + 1);
                }
            }
        }

        // 缩放PDF
        function zoomPDF(delta) {
            const newScale = Math.max(0.5, Math.min(3, currentScale + delta));
            if (newScale !== currentScale) {
                currentScale = newScale;
                renderPage(currentPage);
                preloadNearbyPages(currentPage);
            }
        }

        // 适合宽度
        function fitToWidth() {
            if (!pdfDoc || pageRendering) return;
            
            pdfDoc.getPage(currentPage).then(function(page) {
                const pageWidth = page.getViewport({ scale: 1 }).width;
                const containerWidth = pdfContainer.clientWidth - 40; // 减去padding
                currentScale = containerWidth / pageWidth;
                renderPage(currentPage);
                preloadNearbyPages(currentPage);
            });
        }

        // 适合高度
        function fitToHeight() {
            if (!pdfDoc || pageRendering) return;
            
            pdfDoc.getPage(currentPage).then(function(page) {
                const pageHeight = page.getViewport({ scale: 1 }).height;
                const containerHeight = pdfContainer.clientHeight - 40; // 减去padding
                currentScale = containerHeight / pageHeight;
                renderPage(currentPage);
                preloadNearbyPages(currentPage);
            });
        }

        // 加载目录
        function loadOutline() {
            tocList.innerHTML = '';
            
            pdfDoc.getOutline().then(function(outline) {
                if (outline && outline.length > 0) {
                    renderOutline(outline, tocList);
                } else {
                    tocList.innerHTML = '<div style="padding: 10px; color: var(--text-color);">此PDF没有目录</div>';
                }
            }).catch(function() {
                tocList.innerHTML = '<div style="padding: 10px; color: var(--text-color);">加载目录失败</div>';
            });
        }

        // 渲染目录
        function renderOutline(outline, container, level = 1) {
            outline.forEach(item => {
                const tocItem = document.createElement('div');
                tocItem.className = `toc-item level${level}`;
                tocItem.textContent = item.title;
                
                if (item.dest) {
                    tocItem.addEventListener('click', () => {
                        // 解析目标页面
                        pdfDoc.getDestination(item.dest).then(function(dest) {
                            const pageNumber = dest[0].num;
                            gotoPage(pageNumber);
                        });
                    });
                }
                
                container.appendChild(tocItem);
                
                if (item.items && item.items.length > 0) {
                    renderOutline(item.items, container, level + 1);
                }
            });
        }

        // 加载缩略图
        function loadThumbnails() {
            thumbnailsContainer.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const thumbnail = document.createElement('div');
                thumbnail.className = 'thumbnail';
                thumbnail.dataset.pageNumber = i;
                thumbnail.innerHTML = `<span>${i}</span>`;
                
                thumbnail.addEventListener('click', () => {
                    gotoPage(i);
                });
                
                // 延迟加载缩略图
                setTimeout((pageNum, thumb) => {
                    pdfDoc.getPage(pageNum).then(function(page) {
                        const viewport = page.getViewport({ scale: 0.2 });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        
                        thumb.innerHTML = '';
                        thumb.appendChild(canvas);
                        
                        page.render({
                            canvasContext: context,
                            viewport: viewport
                        });
                    });
                }, i * 100, i, thumbnail);
                
                thumbnailsContainer.appendChild(thumbnail);
            }
        }

        // 切换侧边栏
        function toggleSidebar() {
            isSidebarCollapsed = !isSidebarCollapsed;
            sidebar.classList.toggle('collapsed');
            
            if (isSidebarCollapsed) {
                sidebarToggle.innerHTML = '<i class="fas fa-chevron-left"></i>';
            } else {
                sidebarToggle.innerHTML = '<i class="fas fa-chevron-right"></i>';
            }
        }

        // 移动端切换侧边栏
        function toggleMobileSidebar() {
            sidebar.classList.toggle('visible');
        }

        // 切换标签
        function switchTab(tabName) {
            activeTab = tabName;
            
            tabButtons.forEach(button => {
                if (button.dataset.tab === tabName) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
            
            tabContents.forEach(content => {
                if (content.id === `${tabName}-content`) {
                    content.classList.add('active');
                } else {
                    content.classList.remove('active');
                }
            });
        }

        // 切换查看模式
        function switchViewMode(mode) {
            currentViewMode = mode;
            
            viewModeButtons.forEach(button => {
                if (button.dataset.mode === mode) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
            
            // 重新渲染当前页面
            renderPage(currentPage);
            preloadNearbyPages(currentPage);
        }

        // 切换纯净模式
        function togglePureMode() {
            isPureMode = !isPureMode;
            document.body.classList.toggle('pure-mode', isPureMode);
            
            if (isPureMode) {
                togglePureModeBtn.innerHTML = '<i class="fas fa-compress"></i> 退出纯净';
            } else {
                togglePureModeBtn.innerHTML = '<i class="fas fa-expand"></i> 纯净模式';
            }
        }

        // 切换夜间模式
        function toggleNightMode() {
            isNightMode = !isNightMode;
            document.body.classList.toggle('night-mode', isNightMode);
            
            if (isNightMode) {
                toggleNightModeBtn.innerHTML = '<i class="fas fa-sun"></i>';
                toggleNightModeBtn.querySelector('.tooltip').textContent = '日间模式 (Ctrl+Shift+N)';
            } else {
                toggleNightModeBtn.innerHTML = '<i class="fas fa-moon"></i>';
                toggleNightModeBtn.querySelector('.tooltip').textContent = '夜间模式 (Ctrl+Shift+N)';
            }
        }

        // 打印PDF
        function printPDF() {
            if (!pdfDoc) return;
            
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            
            const promiseChain = [];
            for (let i = 1; i <= totalPages; i++) {
                promiseChain.push(
                    pdfDoc.getPage(i).then(function(page) {
                        const viewport = page.getViewport({ scale: 1.5 });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        
                        return page.render({
                            canvasContext: context,
                            viewport: viewport
                        }).promise.then(function() {
                            return canvas.toDataURL('image/png');
                        });
                    })
                );
            }
            
            Promise.all(promiseChain).then(function(images) {
                const printWindow = iframe.contentWindow;
                printWindow.document.open();
                printWindow.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>打印PDF</title>
                        <style>
                            body { margin: 0; padding: 0; }
                            img { display: block; page-break-after: always; width: 100%; }
                            @page { size: auto; margin: 0; }
                        </style>
                    </head>
                    <body>
                        ${images.map(img => `<img src="${img}">`).join('')}
                    </body>
                    </html>
                `);
                printWindow.document.close();
                
                setTimeout(() => {
                    printWindow.focus();
                    printWindow.print();
                    document.body.removeChild(iframe);
                }, 500);
            });
        }

        // 下载PDF
        function downloadPDF() {
            if (!pdfDoc) return;
            
            // 如果是通过URL加载的PDF
            if (pdfDoc.loadingParams.url) {
                const link = document.createElement('a');
                link.href = pdfDoc.loadingParams.url;
                link.download = pdfDoc.loadingParams.url.split('/').pop() || 'document.pdf';
                link.click();
            } else {
                showError('无法下载本地文件');
            }
        }

        // 更新进度条
        function updateProgress() {
            const progress = (currentPage / totalPages) * 100;
            progressBar.style.width = `${progress}%`;
        }

        // 显示加载指示器
        function showLoading(text) {
            loadingText.textContent = text || '加载中...';
            loadingOverlay.style.display = 'flex';
        }

        // 隐藏加载指示器
        function hideLoading() {
            loadingOverlay.style.display = 'none';
        }

        // 显示错误消息
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        // 处理键盘快捷键
        function handleKeyboardShortcuts(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            // Ctrl + P - 打印
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                e.preventDefault();
                printPDF();
            }
            // Ctrl + + - 放大
            else if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '=')) {
                e.preventDefault();
                zoomPDF(0.2);
            }
            // Ctrl + - - 缩小
            else if ((e.ctrlKey || e.metaKey) && e.key === '-') {
                e.preventDefault();
                zoomPDF(-0.2);
            }
            // Ctrl + Shift + N - 切换夜间模式
            else if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'n') {
                e.preventDefault();
                toggleNightMode();
            }
            // 左箭头 - 上一页
            else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                gotoPrevPage();
            }
            // 右箭头 - 下一页
            else if (e.key === 'ArrowRight') {
                e.preventDefault();
                gotoNextPage();
            }
            // 上箭头 - 上一页
            else if (e.key === 'ArrowUp') {
                e.preventDefault();
                gotoPrevPage();
            }
            // 下箭头 - 下一页
            else if (e.key === 'ArrowDown') {
                e.preventDefault();
                gotoNextPage();
            }
            // Home - 第一页
            else if (e.key === 'Home') {
                e.preventDefault();
                gotoPage(1);
            }
            // End - 最后一页
            else if (e.key === 'End') {
                e.preventDefault();
                gotoPage(totalPages);
            }
            // Esc - 退出纯净模式
            else if (e.key === 'Escape' && isPureMode) {
                e.preventDefault();
                togglePureMode();
            }
        }

        // 处理触摸手势
        let touchStartX = 0;
        let touchStartY = 0;
        
        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }
        
        function handleTouchMove(e) {
            if (!touchStartX || !touchStartY) return;
            
            const touchEndX = e.touches[0].clientX;
            const touchEndY = e.touches[0].clientY;
            
            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - touchEndY;
            
            // 水平滑动距离大于垂直滑动距离时认为是翻页手势
            if (Math.abs(diffX) > Math.abs(diffY)) {
                // 阻止默认行为以避免页面滚动
                e.preventDefault();
                
                // 滑动距离超过50px才触发翻页
                if (Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        // 向左滑动 - 下一页
                        gotoNextPage();
                    } else {
                        // 向右滑动 - 上一页
                        gotoPrevPage();
                    }
                    
                    // 重置起点以避免连续触发
                    touchStartX = 0;
                    touchStartY = 0;
                }
            }
        }

        // 处理滚动事件
        function handleScroll() {
            if (currentViewMode !== 'scroll') return;
            
            const container = pdfContainer;
            const scrollPosition = container.scrollTop + container.clientHeight / 2;
            
            const pages = Array.from(pdfViewer.querySelectorAll('.pdf-page'));
            let visiblePage = null;
            
            for (const page of pages) {
                const pageTop = page.offsetTop;
                const pageBottom = pageTop + page.clientHeight;
                
                if (scrollPosition >= pageTop && scrollPosition <= pageBottom) {
                    visiblePage = parseInt(page.dataset.pageNumber);
                    break;
                }
            }
            
            if (visiblePage && visiblePage !== currentPage) {
                currentPage = visiblePage;
                currentPageInput.value = currentPage;
                updateProgress();
                preloadNearbyPages(currentPage);
            }
        }

        // 处理窗口大小变化
        function handleResize() {
            if (pdfDoc) {
                renderPage(currentPage);
                preloadNearbyPages(currentPage);
            }
        }

        // 初始化可拖动工具栏
        function initDraggableToolbar() {
            let isDragging = false;
            let offsetX, offsetY;
            
            floatingToolbar.addEventListener('mousedown', function(e) {
                if (e.target === floatingToolbar || floatingToolbar.contains(e.target)) {
                    isDragging = true;
                    offsetX = e.clientX - floatingToolbar.getBoundingClientRect().left;
                    offsetY = e.clientY - floatingToolbar.getBoundingClientRect().top;
                    floatingToolbar.style.cursor = 'grabbing';
                    e.preventDefault();
                }
            });
            
            document.addEventListener('mousemove', function(e) {
                if (isDragging) {
                    floatingToolbar.style.left = (e.clientX - offsetX) + 'px';
                    floatingToolbar.style.top = (e.clientY - offsetY) + 'px';
                }
            });
            
            document.addEventListener('mouseup', function() {
                isDragging = false;
                floatingToolbar.style.cursor = '';
            });
        }

        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function() {
                const context = this;
                const args = arguments;
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    func.apply(context, args);
                }, wait);
            };
        }
    </script>
</body>
</html>
