<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF文档阅读器</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 引入PDF.js库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <!-- Tailwind配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CFC9',
                        neutral: '#F5F7FA',
                        dark: '#1D2129',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .text-balance {
                text-wrap: balance;
            }
            .zoom-controls {
                @apply flex items-center space-x-2;
            }
            .zoom-btn {
                @apply p-2 rounded hover:bg-gray-100 transition-all duration-200 text-gray-600 hover:text-primary focus:outline-none focus:ring-2 focus:ring-primary/30;
            }
            .zoom-level {
                @apply min-w-[50px] text-center text-sm;
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-dark antialiased min-h-screen flex flex-col">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-50 transition-all duration-300">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa fa-file-pdf-o text-primary text-2xl"></i>
                <h1 class="text-xl font-bold text-dark">PDF文档阅读器</h1>
            </div>
            <div class="hidden md:flex items-center space-x-6">
                <button id="toggle-directory" class="flex items-center space-x-1 text-gray-600 hover:text-primary transition-colors">
                    <i class="fa fa-bars"></i>
                    <span>目录</span>
                </button>
                <button id="theme-toggle" class="text-gray-600 hover:text-primary transition-colors">
                    <i class="fa fa-moon-o"></i>
                </button>
            </div>
            <button id="mobile-menu-btn" class="md:hidden text-gray-600">
                <i class="fa fa-bars text-xl"></i>
            </button>
        </div>
        <!-- 移动端菜单 -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t">
            <div class="container mx-auto px-4 py-2 flex flex-col space-y-3">
                <button id="mobile-toggle-directory" class="flex items-center space-x-1 py-2 text-gray-600 hover:text-primary transition-colors">
                    <i class="fa fa-bars"></i>
                    <span>目录</span>
                </button>
                <button id="mobile-theme-toggle" class="flex items-center space-x-1 py-2 text-gray-600 hover:text-primary transition-colors">
                    <i class="fa fa-moon-o"></i>
                    <span>切换主题</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-1 flex flex-col md:flex-row">
        <!-- 目录侧边栏 -->
        <aside id="directory-panel" class="bg-white w-full md:w-80 border-r border-gray-200 shadow-sm md:shadow-none md:h-[calc(100vh-64px)] md:sticky md:top-16 transition-all duration-300 transform md:translate-x-0 -translate-x-full absolute inset-y-0 left-0 z-40 overflow-y-auto scrollbar-hide">
            <div class="p-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold">文档目录</h2>
                <p class="text-sm text-gray-500 mt-1">点击下方文档名称进行查看</p>
            </div>
            <ul id="pdf-directory" class="p-2">
                <!-- 目录项将通过JavaScript动态生成 -->
            </ul>
        </aside>
        
        <!-- 遮罩层（移动端目录打开时显示） -->
        <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden" onclick="toggleDirectory()"></div>

        <!-- PDF查看区域 -->
        <section id="pdf-viewer" class="flex-1 p-4 md:p-8 flex flex-col items-center justify-center">
            <div class="w-full max-w-4xl mx-auto">
                <!-- 初始状态提示 -->
                <div id="initial-state" class="text-center py-16">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary/10 text-primary mb-4">
                        <i class="fa fa-file-pdf-o text-3xl"></i>
                    </div>
                    <h2 class="text-xl font-semibold mb-2">选择要查看的PDF文档</h2>
                    <p class="text-gray-500 max-w-md mx-auto text-balance">从左侧目录中选择一个PDF文档，它将在这里显示。无需下载，直接在线查看。</p>
                </div>
                
                <!-- PDF加载状态 -->
                <div id="loading-state" class="text-center py-16 hidden">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mb-4"></div>
                    <h2 class="text-xl font-semibold mb-2">正在加载文档...</h2>
                    <p class="text-gray-500" id="loading-document-name">请稍候</p>
                </div>
                
                <!-- PDF错误状态 -->
                <div id="error-state" class="text-center py-16 hidden">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-100 text-red-500 mb-4">
                        <i class="fa fa-exclamation-triangle text-3xl"></i>
                    </div>
                    <h2 class="text-xl font-semibold mb-2">无法加载文档</h2>
                    <p class="text-gray-500 mb-4" id="error-message">请尝试选择其他文档或稍后再试</p>
                    <button id="retry-button" class="px-4 py-2 bg-primary text-white rounded hover:bg-primary/90 transition-colors">
                        重试
                    </button>
                </div>
                
                <!-- PDF内容区域 -->
                <div id="pdf-container" class="w-full hidden">
                    <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
                        <h2 id="pdf-title" class="text-lg font-semibold truncate"></h2>
                        <div class="flex items-center space-x-4">
                            <!-- 增强的缩放控制区域 -->
                            <div class="zoom-controls">
                                <button id="zoom-fit" class="zoom-btn" title="适应页面">
                                    <i class="fa fa-arrows-alt"></i>
                                </button>
                                <button id="zoom-out" class="zoom-btn" title="缩小">
                                    <i class="fa fa-search-minus"></i>
                                </button>
                                <span id="zoom-level" class="zoom-level">100%</span>
                                <button id="zoom-in" class="zoom-btn" title="放大">
                                    <i class="fa fa-search-plus"></i>
                                </button>
                            </div>
                            <button id="download-pdf" class="zoom-btn" title="下载PDF">
                                <i class="fa fa-download"></i>
                            </button>
                        </div>
                    </div>
                    <div id="pdf-content" class="bg-white shadow-md rounded-lg overflow-hidden border border-gray-200"></div>
                    <div class="flex flex-wrap justify-between items-center mt-4 text-sm text-gray-600 gap-2">
                        <div>
                            <span id="page-num">1</span> / <span id="page-count">0</span>
                        </div>
                        <div class="flex space-x-4">
                            <button id="prev-page" class="hover:text-primary transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                <i class="fa fa-chevron-left"></i> 上一页
                            </button>
                            <button id="next-page" class="hover:text-primary transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                下一页 <i class="fa fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 py-4">
        <div class="container mx-auto px-4 text-center text-sm text-gray-500">
            <p>PDF文档阅读器 &copy; 2023 | 使用PDF.js在线查看PDF文档</p>
        </div>
    </footer>

    <script>
        // 示例PDF文档列表 - 实际使用时可以替换为您自己的PDF链接
        const pdfDocuments = [
            { id: 1, name: "示例文档1", url: "https://chenmin2025.lovestoblog.com/LAn/file1/%E3%80%8AHTML5%E4%BB%8E%E5%85%A5%E9%97%A8%E5%88%B0%E7%B2%BE%E9%80%9A%E3%80%8B%E4%B8%AD%E6%96%87%E5%AD%A6%E4%B9%A0%E6%95%99%E7%A8%8B.pdf" },
            { id: 2, name: "示例文档2 - 较长文档", url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" },
            { id: 3, name: "PDF.js使用指南", url: "https://mozilla.github.io/pdf.js/examples/learning/helloworld.pdf" }
        ];

        // 全局变量
        let pdfDoc = null;
        let currentPage = 1;
        let zoom = 1.0;
        let currentPdfUrl = null;
        let originalZoom = 1.0; // 保存原始缩放比例用于适应页面功能
        
        // DOM元素
        const directoryPanel = document.getElementById('directory-panel');
        const overlay = document.getElementById('overlay');
        const pdfDirectory = document.getElementById('pdf-directory');
        const initialState = document.getElementById('initial-state');
        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');
        const pdfContainer = document.getElementById('pdf-container');
        const pdfContent = document.getElementById('pdf-content');
        const pdfTitle = document.getElementById('pdf-title');
        const pageNumEl = document.getElementById('page-num');
        const pageCountEl = document.getElementById('page-count');
        const prevPageBtn = document.getElementById('prev-page');
        const nextPageBtn = document.getElementById('next-page');
        const zoomInBtn = document.getElementById('zoom-in');
        const zoomOutBtn = document.getElementById('zoom-out');
        const zoomFitBtn = document.getElementById('zoom-fit');
        const zoomLevelEl = document.getElementById('zoom-level');
        const downloadPdfBtn = document.getElementById('download-pdf');
        const loadingDocumentName = document.getElementById('loading-document-name');
        const errorMessage = document.getElementById('error-message');
        const retryButton = document.getElementById('retry-button');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const themeToggle = document.getElementById('theme-toggle');
        const mobileThemeToggle = document.getElementById('mobile-theme-toggle');
        
        // 初始化目录
        function initDirectory() {
            pdfDocuments.forEach(doc => {
                const li = document.createElement('li');
                li.className = 'mb-1';
                
                const link = document.createElement('a');
                link.href = '#';
                link.className = 'flex items-center p-3 rounded-lg hover:bg-primary/5 text-gray-800 hover:text-primary transition-all duration-200 cursor-pointer';
                link.innerHTML = `
                    <i class="fa fa-file-pdf-o mr-3 text-primary"></i>
                    <span class="truncate">${doc.name}</span>
                `;
                
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    loadPdf(doc.url, doc.name);
                    
                    // 在移动设备上点击后关闭目录
                    if (window.innerWidth < 768) {
                        toggleDirectory();
                    }
                });
                
                li.appendChild(link);
                pdfDirectory.appendChild(li);
            });
        }
        
        // 切换目录显示状态（移动端）
        function toggleDirectory() {
            directoryPanel.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
            document.body.classList.toggle('overflow-hidden');
        }
        
        // 切换移动端菜单
        function toggleMobileMenu() {
            mobileMenu.classList.toggle('hidden');
        }
        
        // 加载PDF文档
        function loadPdf(url, name) {
            // 如果点击的是当前已加载的PDF，则不重新加载
            if (url === currentPdfUrl) return;
            
            currentPdfUrl = url;
            currentPage = 1;
            zoom = 1.0;
            originalZoom = 1.0;
            updateZoomLevelDisplay();
            
            // 显示加载状态
            initialState.classList.add('hidden');
            pdfContainer.classList.add('hidden');
            errorState.classList.add('hidden');
            loadingState.classList.remove('hidden');
            loadingDocumentName.textContent = name;
            
            // 清除之前的PDF内容
            pdfContent.innerHTML = '';
            
            // 使用PDF.js加载PDF
            pdfjsLib.getDocument(url).promise
                .then(pdfDoc_ => {
                    pdfDoc = pdfDoc_;
                    pdfTitle.textContent = name;
                    pageCountEl.textContent = pdfDoc.numPages;
                    
                    // 显示PDF容器，隐藏加载状态
                    loadingState.classList.add('hidden');
                    pdfContainer.classList.remove('hidden');
                    
                    // 渲染第一页
                    renderPage(currentPage);
                    
                    // 更新按钮状态
                    updateButtons();
                })
                .catch(error => {
                    console.error('加载PDF时出错:', error);
                    
                    // 显示错误状态
                    loadingState.classList.add('hidden');
                    errorState.classList.remove('hidden');
                    
                    // 设置错误信息
                    if (error.name === 'UnknownError') {
                        errorMessage.textContent = '无法加载此PDF文档。可能是文档格式不正确或链接无效。';
                    } else if (error.name === 'InvalidPDFException') {
                        errorMessage.textContent = '这不是一个有效的PDF文档。';
                    } else if (error.name === 'MissingPDFException') {
                        errorMessage.textContent = '未找到PDF文档。请检查链接是否正确。';
                    } else {
                        errorMessage.textContent = `加载文档时发生错误: ${error.message}`;
                    }
                });
        }
        
        // 渲染指定页码
        function renderPage(num) {
            if (!pdfDoc) return;
            
            pdfDoc.getPage(num).then(page => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 获取PDF容器宽度
                const containerWidth = pdfContent.clientWidth;
                
                // 设置canvas尺寸
                const viewport = page.getViewport({ scale: zoom });
                
                // 如果是适应页面模式，计算适合容器宽度的缩放比例
                if (zoom === 'fit') {
                    const scale = containerWidth / viewport.width;
                    const fitViewport = page.getViewport({ scale: scale });
                    canvas.height = fitViewport.height;
                    canvas.width = fitViewport.width;
                } else {
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                }
                
                // 清除之前的内容
                pdfContent.innerHTML = '';
                pdfContent.appendChild(canvas);
                
                // 渲染PDF页面到canvas
                const renderContext = {
                    canvasContext: ctx,
                    viewport: zoom === 'fit' ? page.getViewport({ scale: containerWidth / viewport.width }) : viewport
                };
                
                const renderTask = page.render(renderContext);
                renderTask.promise.then(() => {
                    currentPage = num;
                    pageNumEl.textContent = num;
                    updateButtons();
                });
            });
        }
        
        // 更新按钮状态
        function updateButtons() {
            if (!pdfDoc) return;
            
            prevPageBtn.disabled = currentPage <= 1;
            nextPageBtn.disabled = currentPage >= pdfDoc.numPages;
            
            // 根据当前缩放级别更新缩放按钮状态
            if (zoom !== 'fit') {
                zoomOutBtn.disabled = zoom <= 0.3;
                zoomInBtn.disabled = zoom >= 3.0;
            } else {
                zoomOutBtn.disabled = false;
                zoomInBtn.disabled = false;
            }
        }
        
        // 更新缩放级别显示
        function updateZoomLevelDisplay() {
            if (zoom === 'fit') {
                zoomLevelEl.textContent = '适应';
            } else {
                zoomLevelEl.textContent = `${Math.round(zoom * 100)}%`;
            }
        }
        
        // 上一页
        function prevPage() {
            if (currentPage <= 1) return;
            renderPage(currentPage - 1);
        }
        
        // 下一页
        function nextPage() {
            if (!pdfDoc || currentPage >= pdfDoc.numPages) return;
            renderPage(currentPage + 1);
        }
        
        // 放大 - 增加10%
        function zoomIn() {
            if (!pdfDoc) return;
            
            // 如果当前是适应页面模式，先恢复到原始缩放
            if (zoom === 'fit') {
                zoom = originalZoom;
            } else if (zoom < 3.0) { // 最大放大到300%
                zoom += 0.1;
                zoom = Math.round(zoom * 10) / 10; // 保留一位小数
            }
            
            updateZoomLevelDisplay();
            renderPage(currentPage);
        }
        
        // 缩小 - 减少10%
        function zoomOut() {
            if (!pdfDoc) return;
            
            // 如果当前是适应页面模式，先恢复到原始缩放
            if (zoom === 'fit') {
                zoom = originalZoom;
            } else if (zoom > 0.3) { // 最小缩小到30%
                zoom -= 0.1;
                zoom = Math.round(zoom * 10) / 10; // 保留一位小数
            }
            
            updateZoomLevelDisplay();
            renderPage(currentPage);
        }
        
        // 适应页面宽度
        function zoomFit() {
            if (!pdfDoc) return;
            
            // 如果当前不是适应模式，保存当前缩放比例
            if (zoom !== 'fit') {
                originalZoom = zoom;
                zoom = 'fit';
            } else {
                // 如果当前是适应模式，恢复到原始缩放
                zoom = originalZoom;
            }
            
            updateZoomLevelDisplay();
            renderPage(currentPage);
        }
        
        // 下载PDF
        function downloadPdf() {
            if (!currentPdfUrl) return;
            
            const link = document.createElement('a');
            link.href = currentPdfUrl;
            link.download = pdfTitle.textContent + '.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        // 重试加载当前PDF
        function retryLoading() {
            if (currentPdfUrl) {
                const currentName = pdfTitle.textContent;
                loadPdf(currentPdfUrl, currentName);
            }
        }
        
        // 切换深色/浅色主题
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            
            // 切换图标
            const icon = themeToggle.querySelector('i');
            const mobileIcon = mobileThemeToggle.querySelector('i');
            
            if (icon.classList.contains('fa-moon-o')) {
                icon.classList.remove('fa-moon-o');
                icon.classList.add('fa-sun-o');
                mobileIcon.classList.remove('fa-moon-o');
                mobileIcon.classList.add('fa-sun-o');
                
                // 应用深色主题
                document.body.classList.add('bg-gray-900', 'text-gray-100');
                document.body.classList.remove('bg-gray-50', 'text-dark');
            } else {
                icon.classList.remove('fa-sun-o');
                icon.classList.add('fa-moon-o');
                mobileIcon.classList.remove('fa-sun-o');
                mobileIcon.classList.add('fa-moon-o');
                
                // 应用浅色主题
                document.body.classList.remove('bg-gray-900', 'text-gray-100');
                document.body.classList.add('bg-gray-50', 'text-dark');
            }
        }
        
        // 事件监听
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化目录
            initDirectory();
            
            // 目录切换按钮
            document.getElementById('toggle-directory').addEventListener('click', toggleDirectory);
            document.getElementById('mobile-toggle-directory').addEventListener('click', toggleDirectory);
            
            // 移动端菜单按钮
            mobileMenuBtn.addEventListener('click', toggleMobileMenu);
            
            // 主题切换
            themeToggle.addEventListener('click', toggleTheme);
            mobileThemeToggle.addEventListener('click', toggleTheme);
            
            // PDF控制按钮
            prevPageBtn.addEventListener('click', prevPage);
            nextPageBtn.addEventListener('click', nextPage);
            zoomInBtn.addEventListener('click', zoomIn);
            zoomOutBtn.addEventListener('click', zoomOut);
            zoomFitBtn.addEventListener('click', zoomFit);
            downloadPdfBtn.addEventListener('click', downloadPdf);
            retryButton.addEventListener('click', retryLoading);
            
            // 键盘导航增强
            document.addEventListener('keydown', (e) => {
                if (!pdfDoc) return;
                
                // 避免在输入框等元素中触发导航
                if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
                
                if (e.key === 'ArrowLeft') {
                    prevPage();
                } else if (e.key === 'ArrowRight') {
                    nextPage();
                } else if (e.key === '+') {
                    zoomIn();
                } else if (e.key === '-') {
                    zoomOut();
                } else if (e.key === '0') {
                    // 按0键重置到100%
                    zoom = 1.0;
                    updateZoomLevelDisplay();
                    renderPage(currentPage);
                } else if (e.key === 'f' && (e.ctrlKey || e.metaKey)) {
                    // 按Ctrl+F或Cmd+F切换适应页面模式
                    e.preventDefault();
                    zoomFit();
                }
            });
            
            // 窗口大小变化时重新渲染当前页以适应新尺寸
            window.addEventListener('resize', () => {
                if (pdfDoc && (zoom === 'fit' || window.innerWidth < 768)) {
                    renderPage(currentPage);
                }
            });
            
            // 添加鼠标滚轮缩放支持
            pdfContent.addEventListener('wheel', (e) => {
                if (!pdfDoc || e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    if (e.deltaY < 0) {
                        // 滚轮向上 - 放大
                        zoomIn();
                    } else {
                        // 滚轮向下 - 缩小
                        zoomOut();
                    }
                }
            }, { passive: false });
        });
    </script>
</body>
</html>
