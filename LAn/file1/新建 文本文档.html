<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF专业阅读器 - 增强版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        dark: {
                            700: '#1e293b',
                            800: '#0f172a',
                            900: '#0d1521',
                        },
                        light: {
                            100: '#f8fafc',
                            200: '#f1f5f9',
                            300: '#e2e8f0'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            overflow: hidden;
            background-color: #f5f7fa;
            transition: background-color 0.3s ease;
        }
        
        body.dark-mode {
            background-color: #0d1521;
            color: #f1f5f9;
        }
        
        .pdf-container {
            transition: all 0.3s ease;
        }
        
        .sidebar {
            transition: transform 0.3s ease;
        }
        
        .sidebar-item:hover {
            background-color: rgba(22, 93, 255, 0.1);
        }
        
        .sidebar-item.active {
            background-color: rgba(22, 93, 255, 0.15);
            border-left: 3px solid #165DFF;
        }
        
        .tool-btn {
            transition: all 0.2s ease;
        }
        
        .tool-btn:hover {
            background-color: rgba(22, 93, 255, 0.1);
        }
        
        #pdf-canvas {
            transition: transform 0.3s ease;
        }
        
        /* 旋转动画 */
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(90deg); }
        }
        
        .rotating {
            animation: rotate 0.3s ease forwards;
        }
        
        /* 加载动画 */
        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid #165DFF;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 页面切换动画 */
        .page-enter {
            opacity: 0;
            transform: translateY(20px);
        }
        
        .page-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.3s ease;
        }
        
        /* 全屏样式 */
        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background: white;
        }
        
        /* 搜索高亮 */
        .highlight {
            background-color: rgba(255, 255, 0, 0.5);
            border-radius: 2px;
        }
        
        /* 缩略图 */
        .thumbnail-item {
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        
        .thumbnail-item:hover {
            transform: scale(1.03);
            border-color: rgba(22, 93, 255, 0.3);
        }
        
        .thumbnail-item.active {
            border-color: #165DFF;
            box-shadow: 0 4px 6px -1px rgba(22, 93, 255, 0.2), 0 2px 4px -1px rgba(22, 93, 255, 0.1);
        }
        
        /* 注释工具栏 */
        .annotation-toolbar {
            transition: transform 0.3s ease;
        }
        
        /* 标签页 */
        .tab-btn {
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }
        
        .tab-btn.active {
            color: #165DFF;
            border-bottom-color: #165DFF;
        }
        
        /* 缩放控件 */
        .zoom-control {
            transition: all 0.3s ease;
        }
        
        /* 页面加载进度 */
        .page-progress {
            height: 3px;
            background: #165DFF;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 0 2px 2px 0;
            transition: width 0.3s ease;
        }

        /* 注释标记 */
        .highlight-annotation {
            background-color: rgba(255, 255, 0, 0.3);
            position: absolute;
            cursor: pointer;
        }

        .underline-annotation {
            border-bottom: 2px solid rgba(255, 0, 0, 0.8);
            position: absolute;
            cursor: pointer;
        }

        .text-annotation {
            background-color: rgba(0, 255, 0, 0.1);
            border: 1px dashed rgba(0, 255, 0, 0.5);
            position: absolute;
            cursor: move;
            padding: 4px;
            border-radius: 4px;
            resize: both;
            overflow: auto;
            min-width: 100px;
            min-height: 40px;
        }
    </style>
</head>
<body class="h-screen flex flex-col bg-light-100 dark:bg-dark-900">
    <!-- 顶部导航栏 -->
    <nav class="bg-primary text-white p-3 flex items-center justify-between shadow-md z-10">
        <div class="flex items-center">
            <button id="sidebar-toggle" class="mr-4 text-white md:hidden">
                <i class="fas fa-bars text-xl"></i>
            </button>
            <h1 class="text-xl font-bold flex items-center">
                <i class="fas fa-file-pdf mr-2"></i>PDF专业阅读器
                <span class="ml-2 bg-white text-primary px-2 py-0.5 rounded text-sm font-normal">增强版</span>
            </h1>
        </div>
        
        <!-- 搜索框 -->
        <div class="relative hidden md:flex w-full max-w-md mx-4 bg-white bg-opacity-20 rounded-lg">
            <input id="search-input" type="text" placeholder="搜索文档内容..." 
                   class="w-full bg-transparent border-0 text-white placeholder-white/70 focus:ring-0 py-2 px-4">
            <button id="search-btn" class="p-2 text-white">
                <i class="fas fa-search"></i>
            </button>
            <div id="search-results" class="absolute top-full left-0 right-0 bg-white text-gray-800 shadow-lg rounded-lg mt-1 py-2 hidden max-h-64 overflow-auto">
                <!-- 搜索结果将在这里动态生成 -->
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <div class="zoom-control flex items-center bg-white bg-opacity-10 rounded-full p-1">
                <button id="zoom-out" class="tool-btn p-2 rounded-full">
                    <i class="fas fa-search-minus"></i>
                </button>
                <div class="relative w-28">
                    <input id="zoom-level" type="range" min="50" max="200" value="100" class="w-full">
                    <div class="absolute -top-6 left-0 right-0 text-center text-xs font-medium">
                        <span id="zoom-percent">100%</span>
                    </div>
                </div>
                <button id="zoom-in" class="tool-btn p-2 rounded-full">
                    <i class="fas fa-search-plus"></i>
                </button>
            </div>
            
            <div class="flex space-x-1">
                <button id="night-mode" class="tool-btn p-2 rounded-full">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="rotate-btn" class="tool-btn p-2 rounded-full">
                    <i class="fas fa-redo"></i>
                </button>
                <button id="fullscreen-btn" class="tool-btn p-2 rounded-full">
                    <i class="fas fa-expand"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        <!-- 侧边栏 -->
        <aside id="sidebar" class="sidebar bg-white dark:bg-dark-800 w-64 md:w-72 border-r border-gray-200 dark:border-gray-700 flex flex-col overflow-y-auto transition-all duration-300 md:translate-x-0">
            <div class="p-3 border-b border-gray-200 dark:border-gray-700">
                <div class="flex space-x-2 mb-3">
                    <button data-tab="library" class="tab-btn text-sm px-3 py-1 active">文档库</button>
                    <button data-tab="thumbnails" class="tab-btn text-sm px-3 py-1">缩略图</button>
                    <button data-tab="outline" class="tab-btn text-sm px-3 py-1">大纲</button>
                    <button data-tab="bookmarks" class="tab-btn text-sm px-3 py-1">书签</button>
                </div>
                <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-200 flex items-center">
                    <i class="fas fa-folder-open mr-2 text-primary"></i>文档库
                </h2>
            </div>
            
            <!-- 文档库面板 -->
            <div id="library-panel" class="overflow-y-auto flex-1">
                <ul id="pdf-list" class="py-2">
                    <!-- PDF列表将通过JavaScript动态生成 -->
                </ul>
            </div>
            
            <!-- 缩略图面板 -->
            <div id="thumbnails-panel" class="overflow-y-auto flex-1 py-2 px-3 hidden">
                <div class="text-center text-gray-500 dark:text-gray-400 py-4" id="thumbnails-placeholder">
                    <i class="fas fa-images text-3xl mb-2"></i>
                    <p>文档缩略图将在这里显示</p>
                </div>
                <div class="grid grid-cols-3 gap-2" id="thumbnails-container">
                    <!-- 缩略图将在这里动态生成 -->
                </div>
            </div>
            
            <!-- 大纲面板 -->
            <div id="outline-panel" class="overflow-y-auto flex-1 py-2 px-3 hidden">
                <div class="text-center text-gray-500 dark:text-gray-400 py-4" id="outline-placeholder">
                    <i class="fas fa-list-alt text-3xl mb-2"></i>
                    <p>文档大纲将在这里显示</p>
                </div>
                <ul id="outline-container" class="py-2">
                    <!-- 大纲条目将在这里动态生成 -->
                </ul>
            </div>
            
            <!-- 书签面板 -->
            <div id="bookmarks-panel" class="overflow-y-auto flex-1 py-2 px-3 hidden">
                <div class="text-center text-gray-500 dark:text-gray-400 py-4" id="bookmarks-placeholder">
                    <i class="fas fa-bookmark text-3xl mb-2"></i>
                    <p>添加的书签将在这里显示</p>
                </div>
                <ul id="bookmarks-container" class="py-2">
                    <!-- 书签将在这里动态生成 -->
                </ul>
            </div>
            
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 text-center text-sm text-gray-500 dark:text-gray-400">
                共 <span id="file-count">4</span> 个文档
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- 注释工具栏 -->
            <div id="annotation-toolbar" class="annotation-toolbar bg-white dark:bg-dark-800 shadow-md p-2 flex justify-center space-x-3 translate-y-0">
                <button data-tool="highlight" class="tool-btn p-2 rounded bg-gray-100 dark:bg-dark-700 hover:bg-gray-200 dark:hover:bg-gray-600">
                    <i class="fas fa-highlighter text-yellow-500"></i>
                </button>
                <button data-tool="underline" class="tool-btn p-2 rounded bg-gray-100 dark:bg-dark-700 hover:bg-gray-200 dark:hover:bg-gray-600">
                    <i class="fas fa-underline text-red-500"></i>
                </button>
                <button data-tool="text" class="tool-btn p-2 rounded bg-gray-100 dark:bg-dark-700 hover:bg-gray-200 dark:hover:bg-gray-600">
                    <i class="fas fa-font text-green-500"></i>
                </button>
                <button id="clear-annotations" class="tool-btn p-2 rounded bg-gray-100 dark:bg-dark-700 hover:bg-gray-200 dark:hover:bg-gray-600">
                    <i class="fas fa-trash text-gray-500"></i>
                </button>
            </div>
            
            <div id="pdf-container" class="pdf-container flex-1 overflow-auto bg-gray-100 dark:bg-dark-700 relative">
                <div id="pdf-viewer" class="min-h-full flex flex-col items-center py-8">
                    <div id="pdf-placeholder" class="flex flex-col items-center justify-center h-full text-center p-8">
                        <i class="fas fa-file-pdf text-primary text-6xl mb-4"></i>
                        <h2 class="text-2xl font-bold text-gray-700 dark:text-gray-200 mb-2">PDF阅读器</h2>
                        <p class="text-gray-500 dark:text-gray-400 max-w-md">从左侧列表中选择一个PDF文件开始阅读，或使用下方按钮打开文档</p>
                        <button id="open-file" class="mt-4 bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                            <i class="fas fa-folder-open mr-2"></i>打开文档
                        </button>
                    </div>
                    <div id="loading" class="hidden absolute inset-0 bg-white dark:bg-dark-700 bg-opacity-80 dark:bg-opacity-80 flex items-center justify-center flex-col">
                        <div class="spinner"></div>
                        <span class="ml-3 text-gray-700 dark:text-gray-200 font-medium mt-3">正在加载文档...</span>
                        <div class="w-64 h-1 bg-gray-200 dark:bg-gray-600 rounded-full mt-4 overflow-hidden">
                            <div id="loading-progress" class="h-full bg-primary"></div>
                        </div>
                    </div>
                    <div id="pdf-viewport" class="relative">
                        <canvas id="pdf-canvas" class="shadow-lg rounded-lg bg-white dark:bg-dark-800"></canvas>
                        <!-- 注释层 -->
                        <div id="annotation-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 底部状态栏 -->
    <footer class="bg-white dark:bg-dark-800 border-t border-gray-200 dark:border-gray-700 p-3 flex items-center justify-between">
        <div class="flex items-center">
            <button id="prev-page" class="tool-btn p-2 rounded mr-2 bg-gray-100 dark:bg-dark-700 hover:bg-gray-200 dark:hover:bg-gray-600">
                <i class="fas fa-arrow-left"></i>
            </button>
            <span class="text-sm font-medium text-gray-700 dark:text-gray-300">页码: 
                <input type="number" id="current-page" class="w-12 text-center border rounded py-1 px-2 mx-1 bg-white dark:bg-dark-700 dark:text-white dark:border-gray-600" min="1" value="1"> 
                / <span id="total-pages">1</span>
            </span>
            <button id="next-page" class="tool-btn p-2 rounded ml-2 bg-gray-100 dark:bg-dark-700 hover:bg-gray-200 dark:hover:bg-gray-600">
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
        <div class="text-sm text-gray-500 dark:text-gray-400">
            <span id="doc-title">未选择文档</span>
        </div>
        <div class="flex items-center">
            <span class="text-sm text-gray-500 dark:text-gray-400 mr-3 hidden md:inline">渲染引擎: PDF.js v3.4.120</span>
            <button id="download-btn" class="text-primary hover:text-blue-700 text-sm font-medium">
                <i class="fas fa-download mr-1"></i>下载
            </button>
        </div>
    </footer>

    <script>
        // PDF文件列表
        const pdfFiles = [
            {
                name: "《HTML5从入门到精通》中文学习教程.pdf",
                url: "https://chenmin2025.lovestoblog.com/LAn/file1/%E3%80%8AHTML5%E4%BB%8E%E5%85%A5%E9%97%A8%E5%88%B0%E7%B2%BE%E9%80%9A%E3%80%8B%E4%B8%AD%E6%96%87%E5%AD%A6%E4%B9%A0%E6%95%99%E7%A8%8B.pdf"
            },
            {
                name: "高一期末考试化学评分细则.pdf",
                url: "https://chenmin2025.lovestoblog.com/1_%E9%AB%98%E4%B8%80%E6%9C%9F%E6%9C%AB%E8%80%83%E8%AF%95%E5%8C%96%E5%AD%A6%E8%AF%84%E5%88%86%E7%BB%86%E5%88%99(2).pdf"
            },
            {
                name: "HTMLCSSJSCombined.pdf",
                url: "https://chenmin2025.lovestoblog.com/HTMLCSSJSCombined.pdf"
            },
            {
                name: "NODE.js入门手册.pdf",
                url: "https://chenmin2025.lovestoblog.com/LAn/file1/NODE.js%E5%85%A5%E9%97%A8%E6%89%8B%E5%86%8C.pdf"
            }
        ];

        // 应用状态
        const state = {
            currentPDF: null,
            currentPage: 1,
            totalPages: 1,
            zoomLevel: 1.0,
            rotation: 0,
            isFullscreen: false,
            isNightMode: false,
            currentSearch: {
                query: '',
                results: [],
                currentIndex: -1
            },
            activeTab: 'library',
            annotations: [],
            currentTool: null,
            bookmarks: [],
            pageCache: {},
            loadingProgress: 0
        };

        // DOM元素
        const elements = {
            pdfList: document.getElementById('pdf-list'),
            pdfCanvas: document.getElementById('pdf-canvas'),
            currentPage: document.getElementById('current-page'),
            totalPages: document.getElementById('total-pages'),
            zoomLevel: document.getElementById('zoom-level'),
            zoomPercent: document.getElementById('zoom-percent'),
            prevPage: document.getElementById('prev-page'),
            nextPage: document.getElementById('next-page'),
            zoomIn: document.getElementById('zoom-in'),
            zoomOut: document.getElementById('zoom-out'),
            rotateBtn: document.getElementById('rotate-btn'),
            fullscreenBtn: document.getElementById('fullscreen-btn'),
            pdfPlaceholder: document.getElementById('pdf-placeholder'),
            loading: document.getElementById('loading'),
            docTitle: document.getElementById('doc-title'),
            sidebarToggle: document.getElementById('sidebar-toggle'),
            sidebar: document.getElementById('sidebar'),
            pdfContainer: document.getElementById('pdf-container'),
            fileCount: document.getElementById('file-count'),
            searchInput: document.getElementById('search-input'),
            searchBtn: document.getElementById('search-btn'),
            searchResults: document.getElementById('search-results'),
            nightMode: document.getElementById('night-mode'),
            annotationToolbar: document.getElementById('annotation-toolbar'),
            annotationLayer: document.getElementById('annotation-layer'),
            thumbnailsPanel: document.getElementById('thumbnails-panel'),
            thumbnailsContainer: document.getElementById('thumbnails-container'),
            thumbnailsPlaceholder: document.getElementById('thumbnails-placeholder'),
            outlinePanel: document.getElementById('outline-panel'),
            outlineContainer: document.getElementById('outline-container'),
            outlinePlaceholder: document.getElementById('outline-placeholder'),
            bookmarksPanel: document.getElementById('bookmarks-panel'),
            bookmarksContainer: document.getElementById('bookmarks-container'),
            bookmarksPlaceholder: document.getElementById('bookmarks-placeholder'),
            libraryPanel: document.getElementById('library-panel'),
            openFile: document.getElementById('open-file'),
            downloadBtn: document.getElementById('download-btn'),
            clearAnnotations: document.getElementById('clear-annotations'),
            loadingProgress: document.getElementById('loading-progress')
        };

        // 初始化PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // 渲染PDF列表
        function renderPDFList() {
            elements.pdfList.innerHTML = '';
            elements.fileCount.textContent = pdfFiles.length;
            
            pdfFiles.forEach((file, index) => {
                const listItem = document.createElement('li');
                listItem.className = 'sidebar-item px-4 py-3 cursor-pointer flex items-center border-b border-gray-100 dark:border-gray-700';
                listItem.innerHTML = `
                    <i class="fas fa-file-pdf text-primary mr-3 text-lg"></i>
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-gray-800 dark:text-gray-200 truncate">${file.name}</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400 truncate">${file.url}</div>
                    </div>
                `;
                
                listItem.addEventListener('click', () => {
                    activateSidebarItem(listItem);
                    loadPDF(file.url, file.name);
                });
                
                elements.pdfList.appendChild(listItem);
            });
        }

        // 激活侧边栏项目
        function activateSidebarItem(item) {
            // 移除所有active类
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // 添加active类到当前项
            item.classList.add('active');
        }

        // 加载PDF文档
        async function loadPDF(url, title) {
            try {
                // 显示加载状态
                elements.loading.classList.remove('hidden');
                elements.pdfPlaceholder.classList.add('hidden');
                updateLoadingProgress(0);
                
                // 重置状态
                state.currentPage = 1;
                state.rotation = 0;
                state.zoomLevel = 1.0;
                state.currentPDF = null;
                state.currentSearch = { query: '', results: [], currentIndex: -1 };
                state.annotations = [];
                
                // 更新文档标题
                elements.docTitle.textContent = title;
                elements.searchInput.value = '';
                elements.searchResults.classList.add('hidden');
                
                // 清除注释
                clearAnnotations();
                
                // 加载PDF
                const loadingTask = pdfjsLib.getDocument({
                    url: url,
                    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/cmaps/',
                    cMapPacked: true
                });
                
                // 监听进度事件
                loadingTask.onProgress = (progress) => {
                    const percent = Math.round((progress.loaded / progress.total) * 100);
                    updateLoadingProgress(percent);
                };
                
                const pdf = await loadingTask.promise;
                
                state.currentPDF = pdf;
                state.totalPages = pdf.numPages;
                elements.totalPages.textContent = state.totalPages;
                elements.currentPage.value = state.currentPage;
                
                updateLoadingProgress(100);
                
                // 渲染第一页
                renderPage();
                
                // 加载缩略图
                loadThumbnails();
                
                // 加载大纲
                loadOutline();
                
            } catch (error) {
                console.error('Error loading PDF:', error);
                elements.pdfPlaceholder.innerHTML = `
                    <i class="fas fa-exclamation-triangle text-red-500 text-6xl mb-4"></i>
                    <h2 class="text-2xl font-bold text-gray-700 dark:text-gray-200 mb-2">加载PDF失败</h2>
                    <p class="text-gray-500 dark:text-gray-400 max-w-md">无法加载文档: ${error.message}</p>
                    <button class="mt-4 bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-lg" onclick="location.reload()">
                        <i class="fas fa-redo mr-2"></i>重新加载
                    </button>
                `;
                elements.pdfPlaceholder.classList.remove('hidden');
            } finally {
                setTimeout(() => {
                    elements.loading.classList.add('hidden');
                }, 300);
            }
        }

        // 更新加载进度
        function updateLoadingProgress(percent) {
            state.loadingProgress = percent;
            elements.loadingProgress.style.width = `${percent}%`;
        }

        // 渲染当前页
        async function renderPage() {
            if (!state.currentPDF) return;
            
            elements.loading.classList.remove('hidden');
            
            try {
                // 尝试从缓存获取页面
                let page;
                if (state.pageCache[state.currentPage]) {
                    page = state.pageCache[state.currentPage];
                } else {
                    page = await state.currentPDF.getPage(state.currentPage);
                    // 缓存页面对象
                    state.pageCache[state.currentPage] = page;
                }
                
                // 设置缩放和旋转
                const viewport = page.getViewport({ 
                    scale: state.zoomLevel * 2, 
                    rotation: state.rotation 
                });
                
                // 设置canvas尺寸
                elements.pdfCanvas.height = viewport.height;
                elements.pdfCanvas.width = viewport.width;
                
                // 渲染PDF页面
                const renderContext = {
                    canvasContext: elements.pdfCanvas.getContext('2d'),
                    viewport: viewport
                };
                
                await page.render(renderContext).promise;
                
                // 清理并重新渲染注释
                renderAnnotations();
                
                // 滚动到顶部
                elements.pdfContainer.scrollTop = 0;
                
                // 更新页面进度指示器
                updatePageProgress();
                
            } catch (error) {
                console.error('Error rendering page:', error);
            } finally {
                elements.loading.classList.add('hidden');
            }
        }

        // 更新页面进度指示器
        function updatePageProgress() {
            const progress = Math.round((state.currentPage / state.totalPages) * 100);
            document.documentElement.style.setProperty('--page-progress', `${progress}%`);
        }

        // 加载缩略图
        async function loadThumbnails() {
            if (!state.currentPDF) return;
            
            elements.thumbnailsContainer.innerHTML = '';
            elements.thumbnailsPlaceholder.classList.add('hidden');
            
            // 最多加载前三页的缩略图，实际应用中可优化为按需加载
            const pagesToLoad = Math.min(3, state.totalPages);
            
            for (let i = 1; i <= pagesToLoad; i++) {
                const page = await state.currentPDF.getPage(i);
                const viewport = page.getViewport({ scale: 0.15 });
                
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                const canvasContext = canvas.getContext('2d');
                await page.render({ canvasContext, viewport }).promise;
                
                const thumbnailItem = document.createElement('div');
                thumbnailItem.className = `thumbnail-item cursor-pointer rounded overflow-hidden ${state.currentPage === i ? 'active' : ''}`;
                thumbnailItem.innerHTML = `
                    <div class="relative">
                        <div class="bg-gray-200 dark:bg-gray-700 aspect-[1/1.414]"></div>
                        <canvas class="absolute inset-0 w-full h-full" data-page="${i}"></canvas>
                        <div class="absolute bottom-1 right-1 bg-black bg-opacity-50 text-white text-xs px-1 rounded">${i}</div>
                    </div>
                `;
                
                // 将渲染好的canvas插入
                const thumbCanvas = thumbnailItem.querySelector('canvas');
                thumbCanvas.width = canvas.width;
                thumbCanvas.height = canvas.height;
                thumbCanvas.getContext('2d').drawImage(canvas, 0, 0);
                
                thumbnailItem.addEventListener('click', () => {
                    state.currentPage = i;
                    elements.currentPage.value = state.currentPage;
                    renderPage();
                    
                    // 更新激活状态
                    document.querySelectorAll('.thumbnail-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    thumbnailItem.classList.add('active');
                });
                
                elements.thumbnailsContainer.appendChild(thumbnailItem);
            }
        }

        // 加载大纲
        async function loadOutline() {
            if (!state.currentPDF) return;
            
            elements.outlineContainer.innerHTML = '';
            
            try {
                const outline = await state.currentPDF.getOutline();
                
                if (outline && outline.length > 0) {
                    elements.outlinePlaceholder.classList.add('hidden');
                    renderOutlineItems(outline, elements.outlineContainer);
                } else {
                    elements.outlinePlaceholder.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error loading outline:', error);
                elements.outlinePlaceholder.classList.remove('hidden');
            }
        }

        // 渲染大纲项目
        function renderOutlineItems(items, container) {
            items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'mb-1';
                
                const link = document.createElement('a');
                link.className = 'block px-3 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer';
                link.textContent = item.title;
                
                link.addEventListener('click', async () => {
                    const dest = item.dest;
                    
                    if (typeof dest === 'string') {
                        // 处理字符串类型的dest
                        const destArray = await state.currentPDF.getDestination(dest);
                        const pageIndex = await state.currentPDF.getPageIndex(destArray[0]);
                        state.currentPage = pageIndex + 1;
                    } else if (Array.isArray(dest)) {
                        // 处理数组类型的dest
                        const pageIndex = await state.currentPDF.getPageIndex(dest[0]);
                        state.currentPage = pageIndex + 1;
                    }
                    
                    elements.currentPage.value = state.currentPage;
                    renderPage();
                });
                
                li.appendChild(link);
                
                if (item.items && item.items.length > 0) {
                    const ul = document.createElement('ul');
                    ul.className = 'ml-4 mt-1';
                    renderOutlineItems(item.items, ul);
                    li.appendChild(ul);
                }
                
                container.appendChild(li);
            });
        }

        // 搜索文档内容
        async function searchPDF(query) {
            if (!query.trim() || !state.currentPDF) return;
            
            elements.loading.classList.remove('hidden');
            
            try {
                state.currentSearch = {
                    query: query,
                    results: [],
                    currentIndex: -1
                };
                
                // 逐页搜索
                for (let i = 1; i <= state.totalPages; i++) {
                    const page = await state.currentPDF.getPage(i);
                    const content = await page.getTextContent();
                    
                    content.items.forEach((item) => {
                        const itemText = item.str.toLowerCase();
                        const queryLower = query.toLowerCase();
                        
                        if (itemText.includes(queryLower)) {
                            state.currentSearch.results.push({
                                page: i,
                                text: item.str,
                                position: item.transform
                            });
                        }
                    });
                }
                
                // 显示搜索结果
                renderSearchResults();
                
                // 如果有结果，跳转到第一个
                if (state.currentSearch.results.length > 0) {
                    highlightNextResult();
                }
                
            } catch (error) {
                console.error('Error searching PDF:', error);
            } finally {
                elements.loading.classList.add('hidden');
            }
        }

        // 渲染搜索结果
        function renderSearchResults() {
            elements.searchResults.innerHTML = '';
            
            if (state.currentSearch.results.length === 0) {
                const noResults = document.createElement('div');
                noResults.className = 'px-4 py-2 text-gray-500';
                noResults.textContent = '未找到匹配内容';
                elements.searchResults.appendChild(noResults);
            } else {
                state.currentSearch.results.forEach((result, index) => {
                    const resultItem = document.createElement('div');
                    resultItem.className = `px-4 py-2 hover:bg-gray-100 cursor-pointer ${index === state.currentSearch.currentIndex ? 'bg-blue-50' : ''}`;
                    resultItem.innerHTML = `
                        <div class="font-medium">第${result.page}页</div>
                        <div class="text-sm text-gray-600 truncate">${result.text}</div>
                    `;
                    
                    resultItem.addEventListener('click', () => {
                        state.currentPage = result.page;
                        elements.currentPage.value = state.currentPage;
                        state.currentSearch.currentIndex = index;
                        renderPage();
                        highlightCurrentResult();
                    });
                    
                    elements.searchResults.appendChild(resultItem);
                });
            }
            
            elements.searchResults.classList.remove('hidden');
        }

        // 高亮下一个搜索结果
        function highlightNextResult() {
            if (state.currentSearch.results.length === 0) return;
            
            state.currentSearch.currentIndex++;
            
            if (state.currentSearch.currentIndex >= state.currentSearch.results.length) {
                state.currentSearch.currentIndex = 0;
            }
            
            const result = state.currentSearch.results[state.currentSearch.currentIndex];
            state.currentPage = result.page;
            elements.currentPage.value = state.currentPage;
            renderPage();
            highlightCurrentResult();
        }

        // 高亮当前搜索结果
        function highlightCurrentResult() {
            clearHighlights();
            
            if (state.currentSearch.currentIndex >= 0) {
                const result = state.currentSearch.results[state.currentSearch.currentIndex];
                
                // 在实际应用中，这里需要计算匹配文本的位置并添加高亮元素
                // 由于时间限制，这里仅做简单演示
                
                // 添加高亮效果
                const highlight = document.createElement('div');
                highlight.className = 'highlight absolute';
                highlight.style.top = '30%';
                highlight.style.left = '20%';
                highlight.style.width = '60%';
                highlight.style.height = '20px';
                elements.annotationLayer.appendChild(highlight);
                
                // 滚动到高亮位置
                elements.pdfContainer.scrollTop = 200;
            }
            
            renderSearchResults();
        }

        // 清除搜索结果高亮
        function clearHighlights() {
            const highlights = elements.annotationLayer.querySelectorAll('.highlight');
            highlights.forEach(highlight => highlight.remove());
        }

        // 渲染注释
        function renderAnnotations() {
            clearAnnotations();
            
            // 仅渲染当前页面的注释
            const pageAnnotations = state.annotations.filter(anno => anno.page === state.currentPage);
            
            pageAnnotations.forEach(anno => {
                if (!anno.position) return;
                
                let annotationElement;
                
                switch(anno.type) {
                    case 'highlight':
                        annotationElement = document.createElement('div');
                        annotationElement.className = 'highlight-annotation';
                        annotationElement.style.top = `${anno.position.y}px`;
                        annotationElement.style.left = `${anno.position.x}px`;
                        annotationElement.style.width = `${anno.position.width}px`;
                        annotationElement.style.height = `${anno.position.height}px`;
                        break;
                    case 'underline':
                        annotationElement = document.createElement('div');
                        annotationElement.className = 'underline-annotation';
                        annotationElement.style.top = `${anno.position.y + anno.position.height - 2}px`;
                        annotationElement.style.left = `${anno.position.x}px`;
                        annotationElement.style.width = `${anno.position.width}px`;
                        annotationElement.style.height = '2px';
                        break;
                    case 'text':
                        annotationElement = document.createElement('div');
                        annotationElement.className = 'text-annotation';
                        annotationElement.contentEditable = true;
                        annotationElement.style.top = `${anno.position.y}px`;
                        annotationElement.style.left = `${anno.position.x}px`;
                        annotationElement.style.width = '150px';
                        annotationElement.style.height = '60px';
                        annotationElement.textContent = '添加注释...';
                        break;
                }
                
                if (annotationElement) {
                    elements.annotationLayer.appendChild(annotationElement);
                }
            });
        }

        // 清除注释显示
        function clearAnnotations() {
            elements.annotationLayer.innerHTML = '';
        }

        // 添加注释
        function addAnnotation(type) {
            // 在实际应用中，这里需要监听用户绘制注释的区域
            // 由于时间限制，这里只做演示
            
            const annotation = {
                id: Date.now(),
                type: type,
                page: state.currentPage,
                position: {
                    x: 100,
                    y: 200,
                    width: 200,
                    height: 30
                },
                content: '',
                createdAt: new Date()
            };
            
            state.annotations.push(annotation);
            renderAnnotations();
        }

        // 初始化事件监听器
        function initEventListeners() {
            // 页码导航
            elements.prevPage.addEventListener('click', () => {
                if (state.currentPage > 1) {
                    state.currentPage--;
                    elements.currentPage.value = state.currentPage;
                    renderPage();
                }
            });
            
            elements.nextPage.addEventListener('click', () => {
                if (state.currentPage < state.totalPages) {
                    state.currentPage++;
                    elements.currentPage.value = state.currentPage;
                    renderPage();
                }
            });
            
            elements.currentPage.addEventListener('change', () => {
                let pageNum = parseInt(elements.currentPage.value);
                if (isNaN(pageNum)) pageNum = state.currentPage;
                if (pageNum < 1) pageNum = 1;
                if (pageNum > state.totalPages) pageNum = state.totalPages;
                
                state.currentPage = pageNum;
                elements.currentPage.value = state.currentPage;
                renderPage();
            });
            
            // 缩放控制
            elements.zoomIn.addEventListener('click', () => {
                state.zoomLevel = Math.min(2.0, state.zoomLevel + 0.1);
                updateZoomUI();
                renderPage();
            });
            
            elements.zoomOut.addEventListener('click', () => {
                state.zoomLevel = Math.max(0.5, state.zoomLevel - 0.1);
                updateZoomUI();
                renderPage();
            });
            
            elements.zoomLevel.addEventListener('input', () => {
                const zoomValue = parseInt(elements.zoomLevel.value);
                state.zoomLevel = zoomValue / 100;
                updateZoomUI();
                renderPage();
            });
            
            // 旋转
            elements.rotateBtn.addEventListener('click', () => {
                state.rotation = (state.rotation + 90) % 360;
                renderPage();
            });
            
            // 全屏
            elements.fullscreenBtn.addEventListener('click', toggleFullscreen);
            
            // 侧边栏切换
            elements.sidebarToggle.addEventListener('click', () => {
                elements.sidebar.classList.toggle('-translate-x-full');
            });
            
            // 点击PDF容器关闭移动端侧边栏
            elements.pdfContainer.addEventListener('click', () => {
                if (window.innerWidth < 768 && !elements.sidebar.classList.contains('-translate-x-full')) {
                    elements.sidebar.classList.add('-translate-x-full');
                }
            });
            
            // 夜间模式
            elements.nightMode.addEventListener('click', toggleNightMode);
            
            // 搜索功能
            elements.searchBtn.addEventListener('click', () => {
                const query = elements.searchInput.value.trim();
                if (query) {
                    searchPDF(query);
                }
            });
            
            elements.searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const query = elements.searchInput.value.trim();
                    if (query) {
                        searchPDF(query);
                    }
                }
            });
            
            // 点击外部关闭搜索结果
            document.addEventListener('click', (e) => {
                if (!elements.searchResults.contains(e.target) && 
                    !elements.searchInput.contains(e.target) && 
                    !elements.searchBtn.contains(e.target)) {
                    elements.searchResults.classList.add('hidden');
                }
            });
            
            // 侧边栏选项卡
            document.querySelectorAll('[data-tab]').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabName = tab.getAttribute('data-tab');
                    switchTab(tabName);
                });
            });
            
            // 注释工具
            document.querySelectorAll('[data-tool]').forEach(tool => {
                tool.addEventListener('click', () => {
                    const toolType = tool.getAttribute('data-tool');
                    state.currentTool = toolType;
                    addAnnotation(toolType);
                    
                    // 高亮当前工具
                    document.querySelectorAll('[data-tool]').forEach(t => {
                        t.classList.remove('ring-2', 'ring-primary');
                    });
                    tool.classList.add('ring-2', 'ring-primary');
                });
            });
            
            // 清除注释
            elements.clearAnnotations.addEventListener('click', () => {
                // 仅清除当前页面的注释
                state.annotations = state.annotations.filter(anno => anno.page !== state.currentPage);
                renderAnnotations();
            });
            
            // 打开文件按钮
            elements.openFile.addEventListener('click', () => {
                const firstItem = elements.pdfList.querySelector('.sidebar-item');
                if (firstItem) {
                    firstItem.click();
                }
            });
            
            // 下载按钮
            elements.downloadBtn.addEventListener('click', () => {
                if (state.currentPDF) {
                    const link = document.createElement('a');
                    let fileName = elements.docTitle.textContent;
                    if (fileName === '未选择文档') fileName = 'document.pdf';
                    link.href = state.currentPDF.loadingParams.url;
                    link.download = fileName;
                    link.click();
                }
            });
        }

        // 切换夜间模式
        function toggleNightMode() {
            state.isNightMode = !state.isNightMode;
            document.body.classList.toggle('dark-mode', state.isNightMode);
            
            // 更新按钮图标
            const icon = elements.nightMode.querySelector('i');
            if (state.isNightMode) {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        }

        // 切换侧边栏选项卡
        function switchTab(tabName) {
            state.activeTab = tabName;
            
            // 隐藏所有面板
            elements.libraryPanel.classList.add('hidden');
            elements.thumbnailsPanel.classList.add('hidden');
            elements.outlinePanel.classList.add('hidden');
            elements.bookmarksPanel.classList.add('hidden');
            
            // 显示当前面板
            if (tabName === 'library') {
                elements.libraryPanel.classList.remove('hidden');
            } else if (tabName === 'thumbnails') {
                elements.thumbnailsPanel.classList.remove('hidden');
            } else if (tabName === 'outline') {
                elements.outlinePanel.classList.remove('hidden');
            } else if (tabName === 'bookmarks') {
                elements.bookmarksPanel.classList.remove('hidden');
            }
            
            // 更新选项卡激活状态
            document.querySelectorAll('.tab-btn').forEach(tab => {
                tab.classList.toggle('active', tab.getAttribute('data-tab') === tabName);
            });
        }

        // 更新缩放UI
        function updateZoomUI() {
            const zoomPercent = Math.round(state.zoomLevel * 100);
            elements.zoomLevel.value = zoomPercent;
            elements.zoomPercent.textContent = `${zoomPercent}%`;
        }

        // 切换全屏
        function toggleFullscreen() {
            if (!state.isFullscreen) {
                if (elements.pdfContainer.requestFullscreen) {
                    elements.pdfContainer.requestFullscreen();
                } else if (elements.pdfContainer.mozRequestFullScreen) {
                    elements.pdfContainer.mozRequestFullScreen();
                } else if (elements.pdfContainer.webkitRequestFullscreen) {
                    elements.pdfContainer.webkitRequestFullscreen();
                } else if (elements.pdfContainer.msRequestFullscreen) {
                    elements.pdfContainer.msRequestFullscreen();
                }
                elements.pdfContainer.classList.add('fullscreen');
                state.isFullscreen = true;
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                elements.pdfContainer.classList.remove('fullscreen');
                state.isFullscreen = false;
            }
        }

        // 初始化应用
        function initApp() {
            renderPDFList();
            initEventListeners();
            updateZoomUI();
            switchTab('library');
            
            // 初始加载第一个PDF
            setTimeout(() => {
                const firstItem = elements.pdfList.querySelector('.sidebar-item');
                if (firstItem) {
                    firstItem.click();
                }
            }, 500);
        }

        // 启动应用
        window.addEventListener('DOMContentLoaded', initApp);
        
        // 全屏事件监听
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                elements.pdfContainer.classList.remove('fullscreen');
                state.isFullscreen = false;
            }
        });
    </script>
</body>
</html>
